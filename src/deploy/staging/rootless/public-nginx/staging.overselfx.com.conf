# 正式 staging 入口；公网宝塔 Nginx 终止 TLS，业务服务器不保存活动 TLS 私钥。
log_format crm_staging_safe_json escape=json
    '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"trace_id":"$upstream_http_x_trace_id",'
    '"cache_status":"$upstream_cache_status"}';

server {
    listen 80;
    listen [::]:80;
    server_name staging.overselfx.com;

    access_log /www/wwwlogs/staging.overselfx.com.log crm_staging_safe_json;
    error_log /www/wwwlogs/staging.overselfx.com.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/staging.overselfx.com;
        default_type text/plain;
        try_files $uri =404;
    }

    # 查询参数不进入重定向 Location，避免错误的明文 OAuth 请求继续携带 code/state。
    location / {
        return 301 https://staging.overselfx.com$uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.overselfx.com;

    ssl_certificate /www/server/panel/vhost/cert/staging.overselfx.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/staging.overselfx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CRM_STAGING_TLS:10m;
    ssl_session_tickets off;

    access_log /www/wwwlogs/staging.overselfx.com.log crm_staging_safe_json;
    error_log /www/wwwlogs/staging.overselfx.com.error.log warn;
    client_max_body_size 10m;
    # 宝塔在 http 级启用共享代理缓存；本 staging 站点必须遵守 Next HTML 的 no-store。
    proxy_cache off;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 内层 HTTP 代理为其他运行模式保留安全头；公网 TLS 边界先隐藏内层值，
    # 再由上述 add_header 输出唯一、一致的公网策略。
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    location = /healthz {
        access_log /www/wwwlogs/staging.overselfx.com.log crm_staging_safe_json;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 两层代理都关闭缓冲，首个安全 SSE 事件不会滞留在公网入口。
    location = /v1/chat/query {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 240s;
        proxy_send_timeout 30s;
        proxy_set_header Connection "";
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 上游错误可能包含完整请求行；OAuth code/state 不写入公网代理错误日志。
    location = /v1/integrations/tiktok/oauth/callback {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Webhook query 和验签材料同样不得进入 Nginx 原生错误日志。
    location ^~ /v1/webhooks/ {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 仅人工客服媒体上传入口允许 100 MB 视频；其他接口仍保持 10 MB 上限。
    location ~ ^/v1/workspace/sessions/[0-9a-f-]+/messages/media/upload$ {
        client_max_body_size 105m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
            proxy_read_timeout 720s;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 指纹化静态资产对所有坐席相同；只在此路径使用入口已有的共享缓存区。
    # HTML 与所有 /v1/ 请求继续不进入共享缓存。
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_cache cache_one;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
