events {}

http {
    server_tokens off;
    # 访问日志只记录规范化 URI，不记录查询串；OAuth code/state、搜索词和其他
    # 敏感参数因此不会进入代理日志。应用 trace_id 仍用于业务链路诊断。
    log_format safe_json escape=json
        '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time}';
    access_log /dev/stdout safe_json;
    error_log /dev/stderr warn;

    # HTTP 只用于跳转，OAuth、Webhook、Cookie 和管理端流量统一走 HTTPS。
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;

        client_max_body_size 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SSE 必须关闭代理缓冲；输出仍是应用安全校验后的传输层分块。
        location = /v1/chat/query {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Nginx 原生 error_log 在上游失败时可能附带完整 request line。OAuth
        # callback 的 code/state 属于一次性凭据，因此该精确路由只依赖应用侧
        # 已脱敏 trace 日志排障，代理错误日志直接丢弃。
        location = /v1/integrations/tiktok/oauth/callback {
            error_log /dev/null;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~ ^/v1/workspace/sessions/[0-9a-f-]+/messages/media/upload$ {
            client_max_body_size 105m;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_read_timeout 720s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
