# Rootless staging 安全边界：预发布只允许回环访问，并默认关闭所有真实写入与模型能力。
x-rootless-staging-runtime: &rootless-staging-runtime
  APP_ENV: "staging"
  REAL_TIKTOK_READ_ENABLED: "false"
  REAL_TIKTOK_WEBHOOK_ENABLED: "false"
  TIKTOK_CONVERSATION_SYNC_ENABLED: "false"
  REAL_TIKTOK_MESSAGE_WRITE_ENABLED: "false"
  REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED: "false"
  LLM_ENABLED: "false"
  SSE_LOAD_TEST_ENABLED: "false"
  LLM_LIVE_EVAL: "false"
  AI_TRANSLATION_ENABLED: "false"
  WORKSPACE_MESSAGE_TRANSLATION_ENABLED: "false"
  AI_MARKETING_ENABLED: "false"
  AUTO_REPLY_ENABLED: "false"
  ALLOW_MOCK_PLATFORM_ADAPTERS: "false"

services:
  backend:
    environment:
      <<: *rootless-staging-runtime
      CHAT_QUERY_LIMIT: "10"
  worker:
    environment:
      <<: *rootless-staging-runtime
  jobs:
    environment:
      <<: *rootless-staging-runtime
  agent-worker:
    environment:
      <<: *rootless-staging-runtime
  proxy:
    ports: !override
      - "127.0.0.1:18081:80"
    volumes: !override
      - type: bind
        source: ../deploy/nginx/nginx-tunnel.conf
        target: /etc/nginx/nginx.conf
        read_only: true
