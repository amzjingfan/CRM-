# 仅由 EnableCustomerAutomation 在所有受审 staging 叠加之后加入；店铺范围仍由门禁参数注入。
# 生产者和消费者都须通过 Settings 与可信入站检查，因此四个应用服务共同持有自动化授权。
x-customer-automation: &customer-automation
  REAL_TIKTOK_AUTOMATION_ENABLED: "true"
  AUTO_REPLY_ENABLED: "true"
  LLM_ENABLED: "true"
  AGENT_V2_FORMAL_ENABLED: "true"
  EMBEDDING_ENABLED: "true"
  RETRIEVAL_MODEL_SERVICE_URL: http://retrieval-model-service:8010
  RETRIEVAL_MODEL_SERVICE_TOKEN: ${RETRIEVAL_MODEL_SERVICE_TOKEN:?RETRIEVAL_MODEL_SERVICE_TOKEN is required}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
  LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:?LLM_PRIMARY_PROVIDER is required}
  LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:?LLM_PRIMARY_MODEL is required}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
  LLM_PRIMARY_CONTEXT_WINDOW_TOKENS: ${LLM_PRIMARY_CONTEXT_WINDOW_TOKENS:-8192}
  LLM_FALLBACK_CONTEXT_WINDOW_TOKENS: ${LLM_FALLBACK_CONTEXT_WINDOW_TOKENS:-8192}
  REAL_TIKTOK_READ_ENABLED: "true"
  REAL_TIKTOK_MESSAGE_WRITE_ENABLED: "true"
  TIKTOK_MESSAGE_WRITE_ALLOWED_CONVERSATION_ID: ""
  TIKTOK_MESSAGE_WRITE_ALLOWED_STORE_IDS: ${TIKTOK_MESSAGE_WRITE_ALLOWED_STORE_IDS:?reviewed store list is required}
  REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED: "false"
  LOGISTICS_NOTIFICATIONS_ENABLED: "true"
  REAL_TIKTOK_LOGISTICS_NOTIFICATIONS_ENABLED: "true"
  LOGISTICS_NOTIFICATION_POLL_SECONDS: "3600"

services:
  backend:
    environment:
      <<: *customer-automation
  worker:
    environment:
      <<: *customer-automation
  jobs:
    environment:
      <<: *customer-automation
  agent-worker:
    environment:
      <<: *customer-automation
      # 此消费者首次持有真实读写能力，必须取得与现有平台进程相同的固定出口和凭证。
      TIKTOK_APP_KEY: ${TIKTOK_APP_KEY:?TIKTOK_APP_KEY is required}
      TIKTOK_SERVICE_ID: ${TIKTOK_SERVICE_ID:?TIKTOK_SERVICE_ID is required}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:?TIKTOK_APP_SECRET is required}
      TIKTOK_CREDENTIAL_ENCRYPTION_KEY: ${TIKTOK_CREDENTIAL_ENCRYPTION_KEY:?TIKTOK_CREDENTIAL_ENCRYPTION_KEY is required}
      TIKTOK_REQUIRED_SCOPES: ${TIKTOK_REQUIRED_SCOPES:-seller.authorization.info,seller.order.info,seller.customer_service,seller.logistics}
      TIKTOK_EGRESS_PROXY_URL: socks5h://tiktok-egress:1080
    depends_on:
      tiktok-egress:
        condition: service_healthy
    networks:
      - default
      - tiktok-egress
