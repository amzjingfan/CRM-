# 独立 staging 调试：只开放 Agent 管理页，通用 LLM 与平台发送仍关闭。
services:
  backend:
    environment:
      AGENT_DEBUG_ENABLED: "true"
      AGENT_V2_DEBUG_ENABLED: "true"
      LLM_PRIMARY_CONTEXT_WINDOW_TOKENS: ${LLM_PRIMARY_CONTEXT_WINDOW_TOKENS:-8192}
      LLM_FALLBACK_CONTEXT_WINDOW_TOKENS: ${LLM_FALLBACK_CONTEXT_WINDOW_TOKENS:-8192}
      EMBEDDING_ENABLED: "true"
      RETRIEVAL_MODEL_SERVICE_TOKEN: ${RETRIEVAL_MODEL_SERVICE_TOKEN:?RETRIEVAL_MODEL_SERVICE_TOKEN is required}
