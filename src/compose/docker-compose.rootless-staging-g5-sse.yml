# G5 显式 staging 压测窗口；必须作为 Rootless staging 的最后一层覆盖。
# 只开放 backend 的内部草稿与受控限流；其他服务及平台写入仍由基础层关闭。
services:
  backend:
    # 仅临时压测窗口使用四个轻量 API worker；普通 G3 保留基础层的两个。
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    environment:
      APP_ENV: "staging"
      LLM_ENABLED: "true"
      EMBEDDING_ENABLED: "true"
      SSE_LOAD_TEST_ENABLED: "true"
      CHAT_QUERY_LIMIT: "60"
      RETRIEVAL_MODEL_SERVICE_TOKEN: ${RETRIEVAL_MODEL_SERVICE_TOKEN:?RETRIEVAL_MODEL_SERVICE_TOKEN is required}
