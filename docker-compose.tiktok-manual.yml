# 真实 TikTok 只读、Webhook 与人工普通消息的受控生产叠加文件。
# 必须与 docker-compose.yml、docker-compose.prod.yml 同时使用；所有开关
# 仍默认 false，高风险写入和自动回复不能由本文件开启。
services:
  backend:
    environment:
      REAL_TIKTOK_READ_ENABLED: ${REAL_TIKTOK_READ_ENABLED:-false}
      REAL_TIKTOK_WEBHOOK_ENABLED: ${REAL_TIKTOK_WEBHOOK_ENABLED:-false}
      REAL_TIKTOK_MESSAGE_WRITE_ENABLED: ${REAL_TIKTOK_MESSAGE_WRITE_ENABLED:-false}
      REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED: "false"
      AUTO_REPLY_ENABLED: "false"

  worker:
    environment:
      REAL_TIKTOK_READ_ENABLED: ${REAL_TIKTOK_READ_ENABLED:-false}
      REAL_TIKTOK_WEBHOOK_ENABLED: ${REAL_TIKTOK_WEBHOOK_ENABLED:-false}
      REAL_TIKTOK_MESSAGE_WRITE_ENABLED: "false"
      REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED: "false"
      AUTO_REPLY_ENABLED: "false"
