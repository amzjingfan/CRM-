events {}

http {
    server_tokens off;
    # 双服务器入口仍只记录规范化 URI，避免 OAuth code/state 和搜索参数进入日志。
    log_format safe_json escape=json
        '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time}';
    access_log /dev/stdout safe_json;
    error_log /dev/stderr warn;

    # 宿主机端口只绑定回环，但仍拒绝错误 Host，防止本机其他进程误用该入口。
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name staging.overselfx.com;

        client_max_body_size 10m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 公网层和内层必须同时关闭缓冲，确保安全草稿及时通过 SSE 发送。
        location = /v1/chat/query {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 240s;
            proxy_send_timeout 30s;
            proxy_set_header Connection "";
            proxy_set_header Host staging.overselfx.com;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 上游失败时 Nginx 可能把完整 request line 写入 error_log；OAuth 精确路由禁用该日志。
        location = /v1/integrations/tiktok/oauth/callback {
            error_log /dev/null;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host staging.overselfx.com;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host staging.overselfx.com;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host staging.overselfx.com;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
