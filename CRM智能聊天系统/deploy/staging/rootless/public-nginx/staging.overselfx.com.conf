# 正式 staging 入口；本文件由公网服务器 Nginx 使用，业务服务器不保存活动 TLS 私钥。
log_format crm_staging_safe_json escape=json
    '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time}';

server {
    listen 80;
    listen [::]:80;
    server_name staging.overselfx.com;

    access_log /www/wwwlogs/staging.overselfx.com.log crm_staging_safe_json;
    error_log /www/wwwlogs/staging.overselfx.com.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/staging.overselfx.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://staging.overselfx.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.overselfx.com;

    ssl_certificate /etc/letsencrypt/live/staging.overselfx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.overselfx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CRM_STAGING_TLS:10m;
    ssl_session_tickets off;

    access_log /www/wwwlogs/staging.overselfx.com.log crm_staging_safe_json;
    error_log /www/wwwlogs/staging.overselfx.com.error.log warn;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 两层代理都关闭缓冲，首个安全 SSE 事件不会滞留在公网入口。
    location = /v1/chat/query {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 240s;
        proxy_send_timeout 30s;
        proxy_set_header Connection "";
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Accel-Buffering "no" always;
    }

    # 上游错误可能包含完整请求行；OAuth code/state 不写入公网代理错误日志。
    location = /v1/integrations/tiktok/oauth/callback {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
