# 证书签发前的临时配置；签发完成后必须替换为 staging.overselfx.com.conf。
log_format crm_staging_safe_json escape=json
    '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time}';

server {
    listen 80;
    listen [::]:80;
    server_name staging.overselfx.com;

    access_log /www/wwwlogs/staging.overselfx.com.log crm_staging_safe_json;
    error_log /www/wwwlogs/staging.overselfx.com.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/staging.overselfx.com;
        default_type text/plain;
        try_files $uri =404;
    }

    # TLS 就绪前只允许用该低敏端点验证公网 Nginx 到隧道的连通性。
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host staging.overselfx.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        default_type text/plain;
        return 503 "staging TLS is not ready\n";
    }
}
