x-production-runtime: &production-runtime
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_BUCKET: ${MINIO_BUCKET:-crm-files}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  AUTH_COOKIE_SECURE: "true"
  ALLOW_MOCK_PLATFORM_ADAPTERS: "false"
  # 固定出口 IP 是所有生产进程启动校验需要的非秘密网络配置，不属于 TikTok 凭据。
  TIKTOK_EGRESS_IP: ${TIKTOK_EGRESS_IP:?TIKTOK_EGRESS_IP is required}
  # FS-01 生产基线固定失败关闭；后续能力只能通过经评审的独立叠加文件放行，
  # 避免开发 .env 中的 true 被生产 Compose 意外继承。
  REAL_TIKTOK_READ_ENABLED: "false"
  REAL_TIKTOK_WEBHOOK_ENABLED: "false"
  REAL_TIKTOK_MESSAGE_WRITE_ENABLED: "false"
  REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED: "false"
  LLM_ENABLED: "false"
  LLM_LIVE_EVAL: "false"
  AI_TRANSLATION_ENABLED: "false"
  AI_MARKETING_ENABLED: "false"
  AUTO_REPLY_ENABLED: "false"

# 平台与模型凭据按进程职责独立注入，禁止通过公共锚点整包扩散。
x-production-platform: &production-platform
  TIKTOK_APP_KEY: ${TIKTOK_APP_KEY:-}
  TIKTOK_SERVICE_ID: ${TIKTOK_SERVICE_ID:-}
  TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
  TIKTOK_OAUTH_REDIRECT_URI: ${TIKTOK_OAUTH_REDIRECT_URI:?TIKTOK_OAUTH_REDIRECT_URI is required}
  TIKTOK_OAUTH_MARKET: ${TIKTOK_OAUTH_MARKET:-ROW}
  TIKTOK_OAUTH_STATE_TTL_SECONDS: ${TIKTOK_OAUTH_STATE_TTL_SECONDS:-600}
  TIKTOK_TOKEN_REFRESH_POLL_SECONDS: ${TIKTOK_TOKEN_REFRESH_POLL_SECONDS:-300}
  TIKTOK_TOKEN_REFRESH_LEAD_SECONDS: ${TIKTOK_TOKEN_REFRESH_LEAD_SECONDS:-86400}
  TIKTOK_TOKEN_REFRESH_BATCH_SIZE: ${TIKTOK_TOKEN_REFRESH_BATCH_SIZE:-20}
  TIKTOK_REQUIRED_SCOPES: ${TIKTOK_REQUIRED_SCOPES:-seller.authorization.info,seller.order.info,seller.customer_service,seller.logistics}
  TIKTOK_WEBHOOK_SECRET: ${TIKTOK_WEBHOOK_SECRET:-}
  TIKTOK_CREDENTIAL_ENCRYPTION_KEY: ${TIKTOK_CREDENTIAL_ENCRYPTION_KEY:-}

x-production-model: &production-model
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
  LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-deepseek}
  LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}

# 最小密钥矩阵（retrieval-only 仅含 docker-compose.yml 中显式检索配置）：
# - backend: common + platform + model
# - worker: common + platform
# - jobs: common + platform + model
# - agent-worker: common + model
# - retrieval-model-service: retrieval-only

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.0-pg16}
    ports: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    ports: !reset []
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    ports: !reset []
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}

  backend:
    env_file: !reset []
    ports: !reset []
    expose:
      - "8000"
    volumes: !reset []
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    restart: unless-stopped
    environment:
      <<: [*production-runtime, *production-platform, *production-model]

  worker:
    env_file: !reset []
    volumes: !reset []
    restart: unless-stopped
    environment:
      <<: [*production-runtime, *production-platform]

  jobs:
    env_file: !reset []
    volumes: !reset []
    restart: unless-stopped
    environment:
      <<: [*production-runtime, *production-platform, *production-model]

  agent-worker:
    env_file: !reset []
    volumes: !reset []
    restart: unless-stopped
    environment:
      <<: [*production-runtime, *production-model]

  retrieval-model-service:
    # 基础 Compose 的开发 .env 可能包含 TikTok、DeepSeek、JWT、数据库和
    # MinIO 凭据；生产检索容器只保留显式的本地模型配置与服务 Token。
    env_file: !reset []
    restart: unless-stopped

  frontend:
    ports: !reset []
    expose:
      - "3000"
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend.prod
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-node:20.19.4-alpine3.22}
        NPM_REGISTRY: ${FRONTEND_NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
    volumes: !reset []
    command: ["node", "server.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production

  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27.5-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./deploy/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${TLS_CERT_DIR:?TLS_CERT_DIR is required}
        target: /etc/nginx/certs
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
