name: Staging production gates

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prefetch, validate, deploy, or roll back the staging candidate
        required: true
        type: choice
        options:
          - prefetch
          - validate
          - deploy
          - rollback
      confirm_target:
        description: Type staging to authorize this staging-only operation
        required: true
        type: string
      enable_tiktok_webhook_read:
        description: G2 staging only; enable real TikTok read and Webhook for backend and worker
        required: false
        default: false
        type: boolean
      backend_image:
        description: Candidate backend repository@sha256 digest
        required: true
        type: string
      frontend_image:
        description: Candidate frontend repository@sha256 digest
        required: true
        type: string
      retrieval_model_image:
        description: Candidate retrieval model service repository@sha256 digest
        required: true
        type: string
      previous_backend_image:
        description: Previous backend digest; required for prefetch or rollback
        required: false
        type: string
      previous_frontend_image:
        description: Previous frontend digest; required for prefetch or rollback
        required: false
        type: string
      previous_retrieval_model_image:
        description: Previous retrieval model service digest; required for prefetch or rollback
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: crm-staging-production-gates
  cancel-in-progress: false

jobs:
  prepare_source:
    name: Pack reviewed staging source
    if: ${{ inputs.operation != 'prefetch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      source_sha256: ${{ steps.pack.outputs.source_sha256 }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pack exact staging source
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Staging source does not match the dispatched main commit." >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/crm-staging-source.tar"
          git archive --format=tar --output="$archive" "$GITHUB_SHA"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf 'source_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed staging source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-staging-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crm-staging-source.tar
          if-no-files-found: error
          retention-days: 1

  staging:
    name: Run staging-only gate
    needs: prepare_source
    if: ${{ always() && !cancelled() && (inputs.operation == 'prefetch' || needs.prepare_source.result == 'success') }}
    environment: staging
    runs-on: [self-hosted, linux, x64, crm-staging]
    # The immutable retrieval image is about 8 GiB; prefetch can need more than one GHCR attempt.
    timeout-minutes: ${{ inputs.operation == 'prefetch' && 240 || 120 }}
    steps:
      - name: Download reviewed staging source
        if: ${{ inputs.operation != 'prefetch' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crm-staging-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crm-staging-source-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify reviewed staging source
        if: ${{ inputs.operation != 'prefetch' }}
        id: verify_dispatch_commit
        shell: pwsh
        env:
          SOURCE_SHA256: ${{ needs.prepare_source.outputs.source_sha256 }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if ($env:GITHUB_REF -cne "refs/heads/main" -or $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw "Staging operations must be dispatched from main."
          }
          if ($env:SOURCE_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "The reviewed staging source digest is invalid."
          }
          $archive = Join-Path $env:RUNNER_TEMP "crm-staging-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/crm-staging-source.tar"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "The reviewed staging source archive is missing."
          }
          $actualDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -cne $env:SOURCE_SHA256) {
            throw "The reviewed staging source digest does not match the hosted job."
          }
          # deploy/rollback 的相对 bind mount 必须留在 Runner 清理范围之外。
          $sourceRoot = if ($env:OPERATION -in @("deploy", "rollback")) {
            "/home/crmdeploy/src/crm-reviewed-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          else {
            Join-Path $env:RUNNER_TEMP "crm-reviewed-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          if (Test-Path -LiteralPath $sourceRoot) {
            throw "The staging source directory already exists."
          }
          New-Item -ItemType Directory -Path $sourceRoot | Out-Null
          if ($env:OPERATION -in @("deploy", "rollback")) {
            & chmod 0750 -- $sourceRoot
            if ($LASTEXITCODE -ne 0) { throw "Unable to restrict the persistent staging source directory." }
          }
          & tar -xf $archive -C $sourceRoot
          if ($LASTEXITCODE -ne 0) { throw "Unable to extract the reviewed staging source." }
          & git -C $sourceRoot init --quiet
          if ($LASTEXITCODE -ne 0) { throw "Unable to establish the staging source boundary." }
          "source_root=$sourceRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Verified staging source artifact for dispatch SHA $env:GITHUB_SHA."

      - name: Verify exact prefetch source through GitHub API
        if: ${{ inputs.operation == 'prefetch' }}
        id: verify_prefetch_source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -cne "refs/heads/main" -or $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw "Staging prefetch must be dispatched from a main commit."
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "The read-only GitHub token is unavailable."
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $commit = Invoke-RestMethod -Uri "https://api.github.com/repos/CP11-gh/CRM/git/commits/$env:GITHUB_SHA" -Headers $headers
          if ([string]$commit.sha -cne $env:GITHUB_SHA) {
            throw "GitHub API commit does not match the staging dispatch."
          }
          foreach ($script in @(
            @{ source = 'Prepare-StagingRollbackImages.ps1'; output = 'script_path'; prefix = 'crm-prefetch-source' },
            @{ source = 'Set-StagingDockerPullMode.ps1'; output = 'mode_script_path'; prefix = 'crm-pull-mode-source' },
            @{ source = 'prefetch_ghcr_oci.py'; output = 'oci_script_path'; prefix = 'crm-oci-prefetch-source' }
          )) {
            $source = Invoke-RestMethod -Uri "https://api.github.com/repos/CP11-gh/CRM/contents/src/scripts/$($script.source)?ref=$env:GITHUB_SHA" -Headers $headers
            if ($source.type -cne "file" -or $source.encoding -cne "base64" -or
                [string]$source.sha -cnotmatch '^[0-9a-f]{40}$' -or
                [string]::IsNullOrWhiteSpace([string]$source.content)) {
              throw "GitHub API did not return the exact prefetch source file."
            }
            $scriptBytes = [Convert]::FromBase64String([string]$source.content)
            if ($scriptBytes.Length -eq 0 -or $scriptBytes.Length -gt 200000) {
              throw "GitHub API prefetch source size is invalid."
            }
            $blobPrefix = [Text.Encoding]::ASCII.GetBytes("blob $($scriptBytes.Length)`0")
            [byte[]]$blobInput = $blobPrefix + $scriptBytes
            $actualBlobSha = [Convert]::ToHexString([Security.Cryptography.SHA1]::HashData($blobInput)).ToLowerInvariant()
            if ($actualBlobSha -cne $source.sha) {
              throw "GitHub API prefetch source failed Git blob verification."
            }
            $extension = [IO.Path]::GetExtension($script.source)
            $scriptPath = Join-Path $env:RUNNER_TEMP "$($script.prefix)-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT$extension"
            [IO.File]::WriteAllBytes($scriptPath, $scriptBytes)
            "$($script.output)=$scriptPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          Write-Output "Verified all staging prefetch scripts at dispatch SHA $env:GITHUB_SHA."

      - name: Validate staging target
        shell: pwsh
        env:
          CRM_STAGING_BASE_URL: ${{ vars.CRM_STAGING_BASE_URL }}
        run: |
          if ($env:CRM_STAGING_BASE_URL -cne "https://staging.overselfx.com") {
            throw "CRM_STAGING_BASE_URL must exactly equal https://staging.overselfx.com"
          }

      - name: Log in to GHCR for immutable image pulls
        shell: pwsh
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/crm-staging-docker-config
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GHCR_TOKEN)) {
            throw "GITHUB_TOKEN is unavailable for GHCR login"
          }
          New-Item -ItemType Directory -Force -Path $env:DOCKER_CONFIG | Out-Null
          $env:GHCR_TOKEN | & docker login ghcr.io --username $env:GHCR_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) {
            throw "GHCR login failed"
          }

      - name: Prefetch immutable rollback images
        if: ${{ inputs.operation == 'prefetch' }}
        shell: pwsh
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          BACKEND_IMAGE_INPUT: ${{ inputs.backend_image }}
          FRONTEND_IMAGE_INPUT: ${{ inputs.frontend_image }}
          RETRIEVAL_MODEL_IMAGE_INPUT: ${{ inputs.retrieval_model_image }}
          PREVIOUS_BACKEND_IMAGE_INPUT: ${{ inputs.previous_backend_image }}
          PREVIOUS_FRONTEND_IMAGE_INPUT: ${{ inputs.previous_frontend_image }}
          PREVIOUS_RETRIEVAL_MODEL_IMAGE_INPUT: ${{ inputs.previous_retrieval_model_image }}
          DOCKER_CONFIG: ${{ runner.temp }}/crm-staging-docker-config
          PREFETCH_SCRIPT: ${{ steps.verify_prefetch_source.outputs.script_path }}
          PULL_MODE_SCRIPT: ${{ steps.verify_prefetch_source.outputs.mode_script_path }}
          OCI_PREFETCH_SCRIPT: ${{ steps.verify_prefetch_source.outputs.oci_script_path }}
        run: |
          if ($env:CONFIRM_TARGET -cne "staging") {
            throw "confirm_target must equal staging"
          }
          $runnerUid = (& id -u).Trim()
          if ($LASTEXITCODE -ne 0 -or $runnerUid -notmatch '^[1-9][0-9]*$') {
            throw "Unable to resolve the self-hosted runner UID"
          }
          $dockerHost = "unix:///run/user/$runnerUid/docker.sock"
          $imagePairs = @(
            @('ghcr.io/cp11-gh/crm-backend', $env:BACKEND_IMAGE_INPUT, $env:PREVIOUS_BACKEND_IMAGE_INPUT),
            @('ghcr.io/cp11-gh/crm-frontend', $env:FRONTEND_IMAGE_INPUT, $env:PREVIOUS_FRONTEND_IMAGE_INPUT),
            @('ghcr.io/cp11-gh/crm-retrieval-model-service', $env:RETRIEVAL_MODEL_IMAGE_INPUT, $env:PREVIOUS_RETRIEVAL_MODEL_IMAGE_INPUT)
          )
          foreach ($pair in $imagePairs) {
            $expected = "^$([regex]::Escape($pair[0]))@sha256:[0-9a-f]{64}$"
            if ($pair[1] -cnotmatch $expected -or $pair[2] -cnotmatch $expected) {
              throw "Prefetch requires immutable digests from reviewed GHCR repositories."
            }
          }
          if ($imagePairs[0][1] -ceq $imagePairs[0][2] -and
              $imagePairs[1][1] -ceq $imagePairs[1][2] -and
              $imagePairs[2][1] -ceq $imagePairs[2][2]) {
            throw "Prefetch requires at least one changed application image digest."
          }
          & python3 -c 'import requests; assert tuple(map(int, requests.__version__.split(".")[:2])) >= (2, 32)'
          if ($LASTEXITCODE -ne 0) {
            throw "The staging Runner lacks the reviewed Python HTTP client for resumable OCI transfer."
          }
          $configPath = '/home/crmdeploy/.config/docker/daemon.json'
          $backupPath = "$configPath.crm-prefetch-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.backup"
          $entered = $false
          try {
            & $env:PULL_MODE_SCRIPT -Mode Enter -DockerHost $dockerHost -ConfigPath $configPath -BackupPath $backupPath
            $entered = $true
            & $env:PREFETCH_SCRIPT `
              -Environment staging -ConfirmTarget staging -DockerHost $dockerHost `
              -EvidenceFile (Join-Path $env:RUNNER_TEMP "crm-staging-prefetch-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json") `
              -CandidateBackendImage $env:BACKEND_IMAGE_INPUT `
              -CandidateFrontendImage $env:FRONTEND_IMAGE_INPUT `
              -CandidateRetrievalModelImage $env:RETRIEVAL_MODEL_IMAGE_INPUT `
              -PreviousBackendImage $env:PREVIOUS_BACKEND_IMAGE_INPUT `
              -PreviousFrontendImage $env:PREVIOUS_FRONTEND_IMAGE_INPUT `
              -PreviousRetrievalModelImage $env:PREVIOUS_RETRIEVAL_MODEL_IMAGE_INPUT `
              -ResumableOciScript $env:OCI_PREFETCH_SCRIPT
          }
          finally {
            if ($entered) {
              & $env:PULL_MODE_SCRIPT -Mode Restore -DockerHost $dockerHost -ConfigPath $configPath -BackupPath $backupPath
            }
          }

      - name: Recover Rootless Docker pull configuration
        if: ${{ always() && inputs.operation == 'prefetch' && steps.verify_prefetch_source.outcome == 'success' }}
        shell: pwsh
        env:
          PULL_MODE_SCRIPT: ${{ steps.verify_prefetch_source.outputs.mode_script_path }}
        run: |
          $configPath = '/home/crmdeploy/.config/docker/daemon.json'
          $backupPath = "$configPath.crm-prefetch-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.backup"
          if (Test-Path -LiteralPath $backupPath) {
            & $env:PULL_MODE_SCRIPT -Mode Restore -DockerHost 'unix:///run/user/1004/docker.sock' -ConfigPath $configPath -BackupPath $backupPath
          }

      - name: Run the selected staging gate
        if: ${{ inputs.operation != 'prefetch' }}
        shell: pwsh
        working-directory: ${{ steps.verify_dispatch_commit.outputs.source_root }}
        env:
          OPERATION: ${{ inputs.operation }}
          ENABLE_TIKTOK_WEBHOOK_READ: ${{ inputs.enable_tiktok_webhook_read }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          BACKEND_IMAGE_INPUT: ${{ inputs.backend_image }}
          FRONTEND_IMAGE_INPUT: ${{ inputs.frontend_image }}
          RETRIEVAL_MODEL_IMAGE_INPUT: ${{ inputs.retrieval_model_image }}
          PREVIOUS_BACKEND_IMAGE_INPUT: ${{ inputs.previous_backend_image }}
          PREVIOUS_FRONTEND_IMAGE_INPUT: ${{ inputs.previous_frontend_image }}
          PREVIOUS_RETRIEVAL_MODEL_IMAGE_INPUT: ${{ inputs.previous_retrieval_model_image }}
          CRM_STAGING_ENV_FILE: ${{ secrets.CRM_STAGING_ENV_FILE }}
          CRM_STAGING_BASE_URL: ${{ vars.CRM_STAGING_BASE_URL }}
          DOCKER_CONFIG: ${{ runner.temp }}/crm-staging-docker-config
        run: |
          if ($env:CONFIRM_TARGET -ne "staging") {
            throw "confirm_target must equal staging"
          }
          if ([string]::IsNullOrWhiteSpace($env:CRM_STAGING_ENV_FILE)) {
            throw "The staging Environment secret CRM_STAGING_ENV_FILE is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:CRM_STAGING_BASE_URL)) {
            throw "The staging Environment variable CRM_STAGING_BASE_URL is not configured"
          }
          $enableWebhookRead = $env:ENABLE_TIKTOK_WEBHOOK_READ -ceq "true"
          if ($enableWebhookRead -and $env:OPERATION -notin @("validate", "deploy")) {
            throw "The G2 Webhook read mode is only available for staging validate or deploy."
          }

          $evidence = Join-Path $env:RUNNER_TEMP "crm-staging-$env:OPERATION-evidence.json"
          $runnerUid = (& id -u).Trim()
          if ($LASTEXITCODE -ne 0 -or $runnerUid -notmatch '^[1-9][0-9]*$') {
            throw "Unable to resolve the self-hosted runner UID"
          }
          $dockerHost = "unix:///run/user/$runnerUid/docker.sock"
          $common = @{
            Environment = "staging"
            EnvFile = $env:CRM_STAGING_ENV_FILE
            BaseUrl = $env:CRM_STAGING_BASE_URL
            EvidenceFile = $evidence
          }
          $common["DockerHost"] = $dockerHost
          if ($enableWebhookRead) {
            $common["EnableTikTokWebhookRead"] = $true
          }

          switch ($env:OPERATION) {
            "validate" {
              $parameters = $common.Clone()
              $parameters["BackendImage"] = $env:BACKEND_IMAGE_INPUT
              $parameters["FrontendImage"] = $env:FRONTEND_IMAGE_INPUT
              $parameters["RetrievalModelImage"] = $env:RETRIEVAL_MODEL_IMAGE_INPUT
              $parameters["ConfirmTarget"] = "staging"
              & ./src/scripts/Test-StagingProductionGates.ps1 @parameters -ValidateOnly
            }
            "deploy" {
              $parameters = $common.Clone()
              $parameters["BackendImage"] = $env:BACKEND_IMAGE_INPUT
              $parameters["FrontendImage"] = $env:FRONTEND_IMAGE_INPUT
              $parameters["RetrievalModelImage"] = $env:RETRIEVAL_MODEL_IMAGE_INPUT
              $parameters["ConfirmTarget"] = "staging"
              & ./src/scripts/Test-StagingProductionGates.ps1 @parameters -Deploy -Confirm:$false
            }
            "rollback" {
              if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_BACKEND_IMAGE_INPUT) -or
                  [string]::IsNullOrWhiteSpace($env:PREVIOUS_FRONTEND_IMAGE_INPUT) -or
                  [string]::IsNullOrWhiteSpace($env:PREVIOUS_RETRIEVAL_MODEL_IMAGE_INPUT)) {
                throw "Rollback requires all previous application image digests"
              }
              $parameters = $common.Clone()
              $parameters["CandidateBackendImage"] = $env:BACKEND_IMAGE_INPUT
              $parameters["CandidateFrontendImage"] = $env:FRONTEND_IMAGE_INPUT
              $parameters["CandidateRetrievalModelImage"] = $env:RETRIEVAL_MODEL_IMAGE_INPUT
              $parameters["PreviousBackendImage"] = $env:PREVIOUS_BACKEND_IMAGE_INPUT
              $parameters["PreviousFrontendImage"] = $env:PREVIOUS_FRONTEND_IMAGE_INPUT
              $parameters["PreviousRetrievalModelImage"] = $env:PREVIOUS_RETRIEVAL_MODEL_IMAGE_INPUT
              $parameters["ConfirmTarget"] = "staging"
              & ./src/scripts/Invoke-StagingRollbackDrill.ps1 @parameters -Execute -Confirm:$false
            }
            default {
              throw "Unsupported staging operation"
            }
          }

      - name: Log out from GHCR
        if: ${{ always() && (steps.verify_dispatch_commit.outcome == 'success' || steps.verify_prefetch_source.outcome == 'success') }}
        shell: pwsh
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/crm-staging-docker-config
        run: |
          & docker logout ghcr.io
          if ($LASTEXITCODE -ne 0) {
            throw "GHCR logout failed"
          }

      - name: Upload low-sensitive staging evidence
        if: ${{ success() && inputs.operation != 'prefetch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-${{ inputs.operation }}-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/crm-staging-${{ inputs.operation }}-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload low-sensitive prefetch evidence
        if: ${{ success() && inputs.operation == 'prefetch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-prefetch-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crm-staging-prefetch-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
