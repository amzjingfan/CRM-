name: Publish immutable application images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Git commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  BACKEND_IMAGE: ghcr.io/cp11-gh/crm-backend
  FRONTEND_IMAGE: ghcr.io/cp11-gh/crm-frontend
  RETRIEVAL_MODEL_IMAGE: ghcr.io/cp11-gh/crm-retrieval-model-service

jobs:
  backend:
    name: Publish backend image
    if: github.ref == 'refs/heads/main'
    environment: image-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate source and create immutable candidate tag
        id: metadata
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo "source_sha must equal the current main commit" >&2
            exit 1
          fi
          echo "tag=candidate-$(printf '%s' "$SOURCE_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.metadata.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

  frontend:
    name: Publish frontend image
    if: github.ref == 'refs/heads/main'
    environment: image-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate source and create immutable candidate tag
        id: metadata
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo "source_sha must equal the current main commit" >&2
            exit 1
          fi
          echo "tag=candidate-$(printf '%s' "$SOURCE_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: Dockerfile.frontend.prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/v1
            NPM_REGISTRY=https://registry.npmjs.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

  retrieval-model:
    name: Publish retrieval model service image
    if: github.ref == 'refs/heads/main'
    environment: image-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate source and create immutable candidate tag
        id: metadata
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo "source_sha must equal the current main commit" >&2
            exit 1
          fi
          echo "tag=candidate-$(printf '%s' "$SOURCE_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push retrieval model service
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: Dockerfile.model-service
          platforms: linux/amd64
          push: true
          tags: ${{ env.RETRIEVAL_MODEL_IMAGE }}:${{ steps.metadata.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

  evidence:
    name: Record published RepoDigests
    needs:
      - backend
      - frontend
      - retrieval-model
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write non-secret digest evidence
        shell: bash
        env:
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          BACKEND_TAG: ${{ needs.backend.outputs.tag }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
          FRONTEND_TAG: ${{ needs.frontend.outputs.tag }}
          RETRIEVAL_MODEL_DIGEST: ${{ needs.retrieval-model.outputs.digest }}
          RETRIEVAL_MODEL_TAG: ${{ needs.retrieval-model.outputs.tag }}
        run: |
          mkdir -p image-evidence
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg backend "$BACKEND_IMAGE@$BACKEND_DIGEST" \
            --arg backend_tag "$BACKEND_IMAGE:$BACKEND_TAG" \
            --arg frontend "$FRONTEND_IMAGE@$FRONTEND_DIGEST" \
            --arg frontend_tag "$FRONTEND_IMAGE:$FRONTEND_TAG" \
            --arg retrieval_model "$RETRIEVAL_MODEL_IMAGE@$RETRIEVAL_MODEL_DIGEST" \
            --arg retrieval_model_tag "$RETRIEVAL_MODEL_IMAGE:$RETRIEVAL_MODEL_TAG" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              platform: "linux/amd64",
              backend: {reference: $backend, candidate_tag: $backend_tag},
              frontend: {reference: $frontend, candidate_tag: $frontend_tag},
              retrieval_model: {reference: $retrieval_model, candidate_tag: $retrieval_model_tag},
              production_release: false
            }' > image-evidence/repo-digests.json
          {
            echo "## Immutable application images"
            echo
            echo "- Source: `$SOURCE_SHA`"
            echo "- Backend: `$BACKEND_IMAGE@$BACKEND_DIGEST`"
            echo "- Frontend: `$FRONTEND_IMAGE@$FRONTEND_DIGEST`"
            echo "- Retrieval model: `$RETRIEVAL_MODEL_IMAGE@$RETRIEVAL_MODEL_DIGEST`"
            echo "- production_release=false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-repo-digests-${{ env.SOURCE_SHA }}
          path: image-evidence/repo-digests.json
          if-no-files-found: error
          retention-days: 30
