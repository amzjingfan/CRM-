name: Diagnose staging DeepSeek transport

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      expected_backend_image:
        description: Exact running crm-backend repository@sha256 digest
        required: true
        type: string
      probe_mode:
        description: Transport only, or one unauthenticated request-path probe
        required: true
        type: choice
        options:
          - transport
          - request_path
        default: transport

permissions:
  contents: read

concurrency:
  group: crm-staging-production-gates
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: [self-hosted, linux, x64, crm-staging]
    timeout-minutes: 5
    steps:
      - name: Probe runner and running backend without credentials
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
          PROBE_MODE: ${{ inputs.probe_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:GITHUB_SHA -cne $env:EXPECTED_SOURCE_SHA -or
              $env:EXPECTED_BACKEND_IMAGE -cnotmatch '^ghcr\.io/cp11-gh/crm-backend@sha256:[0-9a-f]{64}$' -or
              $env:PROBE_MODE -cnotin @('transport', 'request_path')) {
            throw 'The reviewed main source or backend digest is invalid.'
          }
          $runnerUid = (& id -u).Trim()
          if ($LASTEXITCODE -ne 0 -or $runnerUid -notmatch '^[1-9][0-9]*$') {
            throw 'Unable to resolve Rootless Docker UID.'
          }
          $dockerHost = "unix:///run/user/$runnerUid/docker.sock"
          $containers = @(& docker --host $dockerHost ps --filter 'label=com.docker.compose.project=crm-staging' --filter 'label=com.docker.compose.service=backend' --format '{{.ID}}')
          if ($LASTEXITCODE -ne 0 -or $containers.Count -ne 1) {
            throw 'Expected exactly one running staging backend.'
          }
          $container = $containers[0]
          $actualImage = (& docker --host $dockerHost inspect --format '{{.Config.Image}}' $container).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualImage -cne $env:EXPECTED_BACKEND_IMAGE) {
            throw 'Running backend image does not match the reviewed digest.'
          }

          # 无凭据 HEAD 只区分传输阶段；丢弃响应正文、地址和原始错误。
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $hostCode = & curl --head --silent --max-time 7 --output /dev/null --write-out '%{http_code}' https://api.deepseek.com/ 2>$null
          $curlExit = $LASTEXITCODE
          $clock.Stop()
          $hostCategory = if ($curlExit -eq 0) { 'http_response' }
            elseif ($curlExit -eq 6) { 'dns_failed' }
            elseif ($curlExit -eq 7) { 'connect_failed' }
            elseif ($curlExit -in @(35, 51, 60)) { 'tls_failed' }
            elseif ($curlExit -eq 28) { 'timeout' }
            else { 'other_failure' }
          $hostHttpClass = if ($curlExit -eq 0 -and $hostCode -match '^[2-5][0-9]{2}$') {
            "$($hostCode.Substring(0, 1))xx"
          } else { 'no_response' }

          $probeCode = @'
          import json
          import os
          import socket
          import ssl
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          from app.shared.config.settings import get_settings

          started = time.monotonic()
          parsed = urlsplit(get_settings().deepseek_base_url)
          config_match = (
              parsed.scheme == "https"
              and parsed.hostname == "api.deepseek.com"
              and parsed.port in (None, 443)
              and parsed.path in ("", "/")
              and not parsed.query
              and not parsed.fragment
              and not parsed.username
              and not parsed.password
          )
          result = {
              "config_match": config_match,
              "dns_status": "not_run",
              "tcp_status": "not_run",
              "tls_status": "not_run",
              "http_status_class": "no_response",
              "https_proxy_present": bool(os.environ.get("HTTPS_PROXY") or os.environ.get("https_proxy")),
              "elapsed_ms": 0,
          }
          if config_match:
              try:
                  socket.getaddrinfo("api.deepseek.com", 443, type=socket.SOCK_STREAM)
                  result["dns_status"] = "passed"
              except (OSError, TimeoutError):
                  result["dns_status"] = "failed"
              if result["dns_status"] == "passed":
                  try:
                      with socket.create_connection(("api.deepseek.com", 443), timeout=5):
                          result["tcp_status"] = "passed"
                  except (OSError, TimeoutError):
                      result["tcp_status"] = "failed"
              if result["tcp_status"] == "passed":
                  try:
                      with socket.create_connection(("api.deepseek.com", 443), timeout=5) as connection:
                          with ssl.create_default_context().wrap_socket(connection, server_hostname="api.deepseek.com"):
                              result["tls_status"] = "passed"
                  except (OSError, TimeoutError, ssl.SSLError):
                      result["tls_status"] = "failed"
              try:
                  request = urllib.request.Request("https://api.deepseek.com/", method="HEAD")
                  with urllib.request.urlopen(request, timeout=7) as response:
                      result["http_status_class"] = f"{response.status // 100}xx"
              except urllib.error.HTTPError as error:
                  result["http_status_class"] = f"{error.code // 100}xx"
              except (OSError, TimeoutError, urllib.error.URLError):
                  pass
          result["elapsed_ms"] = max(0, int((time.monotonic() - started) * 1000))
          print(json.dumps(result, separators=(",", ":")))
          '@
          $containerOutput = $probeCode | & docker --host $dockerHost exec -i $container python - 2>$null
          if ($LASTEXITCODE -ne 0 -or @($containerOutput).Count -ne 1) {
            throw 'Backend transport probe did not return one safe result.'
          }
          $probe = $containerOutput | ConvertFrom-Json -AsHashtable
          if ($probe.dns_status -cnotin @('not_run', 'passed', 'failed') -or
              $probe.tcp_status -cnotin @('not_run', 'passed', 'failed') -or
              $probe.tls_status -cnotin @('not_run', 'passed', 'failed') -or
              $probe.http_status_class -cnotin @('no_response', '2xx', '3xx', '4xx', '5xx') -or
              $probe.elapsed_ms -lt 0 -or $probe.elapsed_ms -gt 30000) {
            throw 'Backend transport probe returned an invalid category.'
          }

          if ($env:PROBE_MODE -eq 'request_path') {
            if (-not $probe.config_match) {
              throw 'Running DeepSeek base path differs from the fixed request-path probe.'
            }
            # 拒绝代理环境并忽略 curlrc，保证无凭据请求不会继承本机认证配置。
            foreach ($proxyName in @('HTTPS_PROXY', 'https_proxy', 'ALL_PROXY', 'all_proxy')) {
              if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($proxyName))) {
                throw 'Request-path probe requires a direct unauthenticated route.'
              }
            }
            function Convert-TimingBucket([double]$Milliseconds) {
              if ($Milliseconds -lt 0) { return 'not_reached' }
              if ($Milliseconds -le 100) { return '0-100ms' }
              if ($Milliseconds -le 500) { return '101-500ms' }
              if ($Milliseconds -le 2000) { return '501-2000ms' }
              if ($Milliseconds -le 7000) { return '2001-7000ms' }
              return '>7000ms'
            }
            $requestCurl = @(& curl -q --silent --max-time 8 --connect-timeout 5 --output /dev/null `
              --header 'Content-Type: application/json' --data-binary '{}' `
              --write-out '%{time_namelookup} %{time_connect} %{time_appconnect} %{time_pretransfer} %{time_starttransfer} %{time_total} %{http_code}' `
              https://api.deepseek.com/chat/completions 2>$null)
            $requestCurlExit = $LASTEXITCODE
            if ($requestCurl.Count -ne 1) { throw 'Runner request-path probe returned no safe timing result.' }
            $requestParts = $requestCurl[0].Trim() -split '\s+'
            if ($requestParts.Count -ne 7 -or $requestParts[6] -notmatch '^[0-9]{3}$') {
              throw 'Runner request-path probe returned an invalid timing shape.'
            }
            try {
              $times = @(for ($index = 0; $index -lt 6; $index++) {
                [double]::Parse($requestParts[$index], [Globalization.CultureInfo]::InvariantCulture)
              })
            } catch { throw 'Runner request-path probe returned an invalid timing value.' }
            $requestHttpClass = if ($requestParts[6] -match '^[2-5][0-9]{2}$') {
              "$($requestParts[6].Substring(0, 1))xx"
            } else { 'no_response' }
            $requestCategory = if ($requestCurlExit -eq 0) { 'http_response' }
              elseif ($requestCurlExit -eq 6) { 'dns_failed' }
              elseif ($requestCurlExit -eq 7) { 'tcp_failed' }
              elseif ($requestCurlExit -in @(35, 51, 60)) { 'tls_failed' }
              elseif ($requestCurlExit -eq 28) { 'timeout' }
              else { 'other_failure' }
            $runnerRequest = [ordered]@{
              category = $requestCategory
              http_status_class = $requestHttpClass
              dns_duration = (Convert-TimingBucket ($times[0] * 1000))
              tcp_duration = $(if ($times[1] -gt 0) { Convert-TimingBucket (($times[1] - $times[0]) * 1000) } else { 'not_reached' })
              tls_duration = $(if ($times[2] -gt 0) { Convert-TimingBucket (($times[2] - $times[1]) * 1000) } else { 'not_reached' })
              request_to_first_byte = $(if ($times[4] -gt 0) { Convert-TimingBucket (($times[4] - $times[3]) * 1000) } else { 'not_reached' })
              total_duration = $(if ($times[5] -gt 0) { Convert-TimingBucket ($times[5] * 1000) } else { 'not_reached' })
            }

            $requestProbeCode = @'
          import http.client
          import json
          import os
          import socket
          import ssl
          import time
          from urllib.parse import urlsplit

          from app.shared.config.settings import get_settings

          def bucket(milliseconds: float) -> str:
              if milliseconds < 0:
                  return "not_reached"
              if milliseconds <= 100:
                  return "0-100ms"
              if milliseconds <= 500:
                  return "101-500ms"
              if milliseconds <= 2000:
                  return "501-2000ms"
              if milliseconds <= 7000:
                  return "2001-7000ms"
              return ">7000ms"

          result = {
              "category": "not_run",
              "http_status_class": "no_response",
              "dns_duration": "not_reached",
              "tcp_duration": "not_reached",
              "tls_duration": "not_reached",
              "request_to_first_byte": "not_reached",
              "total_duration": "not_reached",
          }
          parsed = urlsplit(get_settings().deepseek_base_url)
          config_match = (
              parsed.scheme == "https"
              and parsed.hostname == "api.deepseek.com"
              and parsed.port in (None, 443)
              and parsed.path in ("", "/")
              and not parsed.query
              and not parsed.fragment
              and not parsed.username
              and not parsed.password
          )
          proxy_present = any(os.environ.get(name) for name in ("HTTPS_PROXY", "https_proxy", "ALL_PROXY", "all_proxy"))
          if not config_match:
              result["category"] = "config_mismatch"
          elif proxy_present:
              result["category"] = "proxy_present"
          else:
              started = time.monotonic()
              raw = None
              wrapped = None
              connection = None
              stage = "dns"
              try:
                  addresses = socket.getaddrinfo("api.deepseek.com", 443, type=socket.SOCK_STREAM)
                  dns_finished = time.monotonic()
                  result["dns_duration"] = bucket((dns_finished - started) * 1000)
                  stage = "tcp"
                  for family, socktype, proto, _, sockaddr in addresses:
                      candidate = socket.socket(family, socktype, proto)
                      candidate.settimeout(7)
                      try:
                          candidate.connect(sockaddr)
                      except OSError:
                          candidate.close()
                          continue
                      raw = candidate
                      break
                  if raw is None:
                      raise OSError("connection failed")
                  tcp_finished = time.monotonic()
                  result["tcp_duration"] = bucket((tcp_finished - dns_finished) * 1000)
                  stage = "tls"
                  wrapped = ssl.create_default_context().wrap_socket(raw, server_hostname="api.deepseek.com")
                  tls_finished = time.monotonic()
                  result["tls_duration"] = bucket((tls_finished - tcp_finished) * 1000)
                  stage = "request"
                  connection = http.client.HTTPSConnection("api.deepseek.com", timeout=7)
                  connection.sock = wrapped
                  connection.request("POST", "/chat/completions", body=b"{}", headers={"Content-Type": "application/json"})
                  request_finished = time.monotonic()
                  stage = "response"
                  response = connection.getresponse()
                  first_byte = time.monotonic()
                  result["request_to_first_byte"] = bucket((first_byte - request_finished) * 1000)
                  result["http_status_class"] = f"{response.status // 100}xx"
                  result["category"] = "http_response"
              except (socket.timeout, TimeoutError):
                  result["category"] = "timeout"
              except (OSError, ssl.SSLError):
                  result["category"] = f"{stage}_failed"
              except Exception:
                  result["category"] = "other_failure"
              finally:
                  result["total_duration"] = bucket((time.monotonic() - started) * 1000)
                  if connection is not None:
                      connection.close()
                  elif wrapped is not None:
                      wrapped.close()
                  elif raw is not None:
                      raw.close()
          print(json.dumps(result, separators=(",", ":")))
          '@
            $requestOutput = $requestProbeCode | & docker --host $dockerHost exec -i $container python - 2>$null
            if ($LASTEXITCODE -ne 0 -or @($requestOutput).Count -ne 1) {
              throw 'Backend request-path probe did not return one safe result.'
            }
            $backendRequest = $requestOutput | ConvertFrom-Json -AsHashtable
            $allowedBuckets = @('not_reached', '0-100ms', '101-500ms', '501-2000ms', '2001-7000ms', '>7000ms')
            if ($backendRequest.Count -ne 7 -or
                $backendRequest.category -cnotin @('not_run', 'config_mismatch', 'proxy_present', 'http_response', 'dns_failed', 'tcp_failed', 'tls_failed', 'request_failed', 'response_failed', 'timeout', 'other_failure') -or
                $backendRequest.http_status_class -cnotin @('no_response', '2xx', '3xx', '4xx', '5xx') -or
                $backendRequest.dns_duration -cnotin $allowedBuckets -or
                $backendRequest.tcp_duration -cnotin $allowedBuckets -or
                $backendRequest.tls_duration -cnotin $allowedBuckets -or
                $backendRequest.request_to_first_byte -cnotin $allowedBuckets -or
                $backendRequest.total_duration -cnotin $allowedBuckets) {
              throw 'Backend request-path probe returned an invalid category.'
            }
            $backendRequestHttpClass = $backendRequest.http_status_class
            if ($requestHttpClass -eq '2xx' -or $backendRequestHttpClass -eq '2xx') {
              throw 'Unauthenticated request unexpectedly returned 2xx; stopping.'
            }
          }
          $evidence = [ordered]@{
            schema_version = 1
            evidence_type = 'staging_deepseek_transport_probe'
            source_sha = $env:GITHUB_SHA
            backend_image = $actualImage
            runner = [ordered]@{
              category = $hostCategory
              http_status_class = $hostHttpClass
              elapsed_ms = [Math]::Max(0, [int]$clock.ElapsedMilliseconds)
              https_proxy_present = -not [string]::IsNullOrWhiteSpace($env:HTTPS_PROXY)
            }
            backend = [ordered]@{
              config_match = [bool]$probe.config_match
              dns_status = [string]$probe.dns_status
              tcp_status = [string]$probe.tcp_status
              tls_status = [string]$probe.tls_status
              http_status_class = [string]$probe.http_status_class
              https_proxy_present = [bool]$probe.https_proxy_present
              elapsed_ms = [int]$probe.elapsed_ms
            }
            provider_calls = 0
            service_mutation = $false
            production_release = $false
          }
          if ($env:PROBE_MODE -eq 'request_path') {
            $evidence['request_path'] = [ordered]@{
              runner = $runnerRequest
              backend = [ordered]@{
                category = [string]$backendRequest.category
                http_status_class = [string]$backendRequest.http_status_class
                dns_duration = [string]$backendRequest.dns_duration
                tcp_duration = [string]$backendRequest.tcp_duration
                tls_duration = [string]$backendRequest.tls_duration
                request_to_first_byte = [string]$backendRequest.request_to_first_byte
                total_duration = [string]$backendRequest.total_duration
              }
            }
          }
          $evidencePath = Join-Path $env:RUNNER_TEMP "crm-deepseek-transport-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          "evidence_path=$evidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output 'Read-only DeepSeek transport probe completed.'

      - name: Upload low-sensitive transport evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-deepseek-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crm-deepseek-transport-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
