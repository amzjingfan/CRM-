name: Prepare staging SSE fixture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only check or one exact staging fixture
        required: true
        type: choice
        options: [check_only, provision, preflight, diagnose_auth, diagnose_auth_logs, reconcile_check, reconcile_email, content_check, content_prepare, renew_credentials]
      expected_source_sha:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      expected_backend_image:
        description: Exact running backend repository@sha256 digest
        required: true
        type: string
      confirm_provision:
        description: For provision only, type create-50-isolated-staging-users
        required: false
        type: string
      confirm_reconcile:
        description: For reconcile_email only, type repair-50-existing-g5-emails
        required: false
        type: string
      confirm_content:
        description: Exact confirmation for content_prepare or renew_credentials only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crm-staging-production-gates
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, crm-staging]
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Verify reviewed source
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_SOURCE_SHA -cne $env:GITHUB_SHA) {
            throw 'G5 source must be the exact reviewed main commit.'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $commit = Invoke-RestMethod -Uri "https://api.github.com/repos/CP11-gh/CRM/git/commits/$env:GITHUB_SHA" -Headers $headers -TimeoutSec 30
          if ([string]$commit.sha -cne $env:GITHUB_SHA) {
            throw 'The dispatched G5 commit could not be verified.'
          }
          $sourcePath = Join-Path $env:RUNNER_TEMP "crm-g5-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          foreach ($relative in @(
              'src/backend/scripts/__init__.py',
              'src/backend/scripts/load_test_sse.py',
              'src/backend/scripts/prepare_sse_staging_fixture.py',
              'src/backend/scripts/prepare_sse_staging_content.py',
              'src/backend/scripts/check_sse_staging_fixture.py',
              'src/backend/scripts/preflight_sse_staging_fixture.py',
              'src/backend/scripts/diagnose_sse_staging_auth.py'
              'src/backend/scripts/classify_staging_auth_logs.py'
          )) {
            $uri = "https://api.github.com/repos/CP11-gh/CRM/contents/$($relative)?ref=$env:GITHUB_SHA"
            $source = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30
            if ($source.type -cne 'file' -or $source.encoding -cne 'base64' -or
                [string]$source.sha -cnotmatch '^[0-9a-f]{40}$') {
              throw 'A reviewed G5 source file is unavailable.'
            }
            [byte[]]$bytes = [Convert]::FromBase64String([string]$source.content)
            if ($bytes.Length -lt 1 -or $bytes.Length -gt 100000) {
              throw 'A reviewed G5 source file has an unexpected size.'
            }
            [byte[]]$blobInput = [Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)" + [char]0) + $bytes
            $blobSha = [Convert]::ToHexString([Security.Cryptography.SHA1]::HashData($blobInput)).ToLowerInvariant()
            if ($blobSha -cne [string]$source.sha) {
              throw 'A reviewed G5 source file failed Git blob verification.'
            }
            $target = Join-Path $sourcePath $relative
            $null = New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force
            [IO.File]::WriteAllBytes($target, $bytes)
          }
          "source_path=$sourcePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output 'Exact G5 source and eight Git blobs verified.'

      - name: Check staging runtime
        id: runtime
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_PROVISION: ${{ inputs.confirm_provision }}
          CONFIRM_RECONCILE: ${{ inputs.confirm_reconcile }}
          CONFIRM_CONTENT: ${{ inputs.confirm_content }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
          CRM_STAGING_ENV_FILE: ${{ secrets.CRM_STAGING_ENV_FILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MODE -cnotin @('check_only', 'provision', 'preflight', 'diagnose_auth', 'diagnose_auth_logs', 'reconcile_check', 'reconcile_email', 'content_check', 'content_prepare', 'renew_credentials') -or
              $env:EXPECTED_BACKEND_IMAGE -cnotmatch '^ghcr\.io/cp11-gh/crm-backend@sha256:[0-9a-f]{64}$' -or
              ($env:MODE -cne 'provision' -and $env:CONFIRM_PROVISION) -or
              ($env:MODE -ceq 'provision' -and $env:CONFIRM_PROVISION -cne 'create-50-isolated-staging-users') -or
              ($env:MODE -cne 'reconcile_email' -and $env:CONFIRM_RECONCILE) -or
              ($env:MODE -ceq 'reconcile_email' -and $env:CONFIRM_RECONCILE -cne 'repair-50-existing-g5-emails') -or
              ($env:MODE -cnotin @('content_prepare', 'renew_credentials') -and $env:CONFIRM_CONTENT) -or
              ($env:MODE -ceq 'content_prepare' -and $env:CONFIRM_CONTENT -cne 'prepare-50-isolated-g5-messages') -or
              ($env:MODE -ceq 'renew_credentials' -and $env:CONFIRM_CONTENT -cne 'renew-50-existing-g5-tokens')) {
            throw 'G5 mode, image, or exact provision confirmation is invalid.'
          }
          $runnerUid = (& id -u).Trim()
          if ($LASTEXITCODE -ne 0 -or $runnerUid -cne '1004') {
            throw 'G5 requires the dedicated crmdeploy staging Runner.'
          }
          $dockerHost = "unix:///run/user/$runnerUid/docker.sock"
          $containers = @(& docker --host $dockerHost ps --filter 'label=com.docker.compose.project=crm-staging' --filter 'label=com.docker.compose.service=backend' --format '{{.ID}}')
          if ($LASTEXITCODE -ne 0 -or $containers.Count -ne 1) {
            throw 'Expected exactly one running staging backend.'
          }
          $container = $containers[0]
          $actualImage = (& docker --host $dockerHost inspect --format '{{.Config.Image}}' $container).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualImage -cne $env:EXPECTED_BACKEND_IMAGE) {
            throw 'Running G5 backend image differs from the reviewed digest.'
          }
          $envFile = $env:CRM_STAGING_ENV_FILE
          if (-not [IO.Path]::IsPathRooted($envFile) -or
              -not (Test-Path -LiteralPath $envFile -PathType Leaf) -or
              $envFile.StartsWith($env:GITHUB_WORKSPACE + '/', [StringComparison]::Ordinal)) {
            throw 'Protected staging configuration path is unavailable.'
          }
          $envItem = Get-Item -LiteralPath $envFile -Force
          $envOwner = (& stat -c '%u' $envFile).Trim()
          $envMode = (& stat -c '%a' $envFile).Trim()
          if ($LASTEXITCODE -ne 0 -or $envItem.LinkType -or $envOwner -cne '1004' -or
              $envMode -cnotmatch '^[0-7]{3,4}$' -or
              ([Convert]::ToInt32($envMode, 8) -band 63) -ne 0) {
            throw 'Protected staging configuration ownership or permissions are invalid.'
          }
          $databaseLines = @()
          foreach ($line in Get-Content -LiteralPath $envFile -Encoding utf8) {
            $trimmed = $line.Trim()
            if (-not $trimmed -or $trimmed.StartsWith('#')) { continue }
            $separator = $trimmed.IndexOf('=')
            if ($separator -gt 0 -and $trimmed.Substring(0, $separator).Trim() -ceq 'DATABASE_URL') {
              $databaseLines += $trimmed.Substring($separator + 1)
            }
          }
          if ($databaseLines.Count -ne 1 -or [string]::IsNullOrWhiteSpace($databaseLines[0])) {
            throw 'Protected staging DATABASE_URL is missing or ambiguous.'
          }
          $databaseSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($databaseLines[0]))
          ).ToLowerInvariant()
          $runningSha256 = (& docker --host $dockerHost exec $container python -B -c 'import hashlib, os; print(hashlib.sha256(os.environ["DATABASE_URL"].encode()).hexdigest())' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $runningSha256 -cne $databaseSha256) {
            throw 'Running backend database target differs from protected deployment configuration.'
          }
          $privateDir = '/home/crmdeploy/.cache/crm-g5-fixtures'
          $privateParent = '/home/crmdeploy/.cache'
          if (-not (Test-Path -LiteralPath $privateParent -PathType Container) -or
              (Get-Item -LiteralPath $privateParent -Force).LinkType -or
              (& stat -c '%u' $privateParent).Trim() -cne '1004') {
            throw 'Private G5 credential parent is unavailable.'
          }
          if (Test-Path -LiteralPath $privateDir) {
            $item = Get-Item -LiteralPath $privateDir -Force
            $mode = (& stat -c '%a' $privateDir).Trim()
            if (-not $item.PSIsContainer -or $item.LinkType -or
                (& stat -c '%u' $privateDir).Trim() -cne '1004' -or
                ([Convert]::ToInt32($mode, 8) -band 63) -ne 0) {
              throw 'Private G5 credential directory is unsafe.'
            }
            $privateItems = @(Get-ChildItem -LiteralPath $privateDir -Force)
            if ($env:MODE -cin @('preflight', 'diagnose_auth', 'reconcile_check', 'reconcile_email', 'content_check', 'content_prepare', 'renew_credentials')) {
              $expectedName = 'g5-38852775454-1.json'
              $newName = 'g5-38852775454-2.json'
              $renewedName = 'g5-38852775454-3.json'
              $itemNames = @($privateItems | ForEach-Object { $_.Name })
              if ($itemNames -cnotcontains $expectedName -or
                  @($itemNames | Where-Object { $_ -cnotin @($expectedName, $newName, $renewedName) }).Count -ne 0 -or
                  ($env:MODE -cin @('reconcile_check', 'reconcile_email') -and $privateItems.Count -ne 1) -or
                  ($env:MODE -cin @('content_check', 'content_prepare', 'renew_credentials') -and
                   ($privateItems.Count -ne 2 -or $itemNames -cnotcontains $newName)) -or
                  ($privateItems.Count -eq 3 -and $itemNames -cnotcontains $newName) -or
                  ($env:MODE -cin @('preflight', 'diagnose_auth') -and $privateItems.Count -notin @(1, 2, 3))) {
                throw 'Expected exact G5 private fixture files only.'
              }
              foreach ($privateItem in $privateItems) {
                $privateFile = Join-Path $privateDir $privateItem.Name
                $fileMode = (& stat -c '%a' $privateFile).Trim()
                if ($privateItem.LinkType -or $privateItem.PSIsContainer -or $LASTEXITCODE -ne 0 -or
                    (& stat -c '%u' $privateFile).Trim() -cne '1004' -or
                    ([Convert]::ToInt32($fileMode, 8) -band 63) -ne 0) {
                  throw 'G5 private fixture permissions are invalid.'
                }
              }
            } elseif ($env:MODE -cne 'diagnose_auth_logs' -and $privateItems.Count -ne 0) {
              throw 'Existing G5 private material requires reconciliation before a new run.'
            }
          } elseif ($env:MODE -cin @('preflight', 'diagnose_auth', 'reconcile_check', 'reconcile_email', 'content_check', 'content_prepare', 'renew_credentials')) {
            throw 'Expected G5 private fixture is missing.'
          }
          "docker_host=$dockerHost" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "container=$container" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "database_sha256=$databaseSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "private_dir=$privateDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($env:MODE -cin @('preflight', 'diagnose_auth')) {
            $selectedName = if ($privateItems.Count -eq 3) { 'g5-38852775454-3.json' } elseif ($privateItems.Count -eq 2) { 'g5-38852775454-2.json' } else { 'g5-38852775454-1.json' }
            "private_file_name=$selectedName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          Write-Output 'Staging Runner, immutable backend, database target, and private path verified.'

      - name: Read-only fixture check
        if: inputs.mode == 'check_only' || inputs.mode == 'provision'
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          DOCKER_HOST: ${{ steps.runtime.outputs.docker_host }}
          CONTAINER: ${{ steps.runtime.outputs.container }}
          ENV_FILE: ${{ secrets.CRM_STAGING_ENV_FILE }}
          DATABASE_SHA256: ${{ steps.runtime.outputs.database_sha256 }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:SOURCE_PATH 'src/backend'
          $args = @(
            '--host', $env:DOCKER_HOST, 'run', '--rm', '--pull=never', '--read-only',
            '--network', "container:$env:CONTAINER", '--user', '0:0',
            '--env-file', $env:ENV_FILE,
            '-e', 'APP_ENV=staging', '-e', 'AUTH_COOKIE_SECURE=true',
            '-e', 'LLM_ENABLED=false', '-e', 'LLM_LIVE_EVAL=false',
            '-e', 'REAL_TIKTOK_READ_ENABLED=false', '-e', 'REAL_TIKTOK_WEBHOOK_ENABLED=false',
            '-e', 'REAL_TIKTOK_MESSAGE_WRITE_ENABLED=false', '-e', 'REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED=false',
            '-e', 'AI_TRANSLATION_ENABLED=false', '-e', 'AI_MARKETING_ENABLED=false',
            '-e', 'AUTO_REPLY_ENABLED=false', '-e', 'PYTHONPATH=/opt/crm-g5-source:/app',
            '--mount', "type=bind,source=$source,target=/opt/crm-g5-source,readonly",
            '--entrypoint', 'python', $env:EXPECTED_BACKEND_IMAGE,
            '-B', '-m', 'scripts.check_sse_staging_fixture',
            '--expected-database-sha256', $env:DATABASE_SHA256
          )
          $output = & docker @args 2>$null
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in @($output)) {
              if ($line -cmatch '^\{"failure_stage": "(config|database_read|permission_missing|existing_fixture)"') {
                Write-Output "G5 check_only failure_stage=$($Matches[1])"
                break
              }
            }
            throw 'G5 read-only fixture check failed.'
          }
          $report = $output | ConvertFrom-Json
          if ($report.mode -cne 'check_only' -or $report.ready -cne $true -or $report.provider_calls -ne 0) {
            throw 'G5 read-only fixture check returned an invalid result.'
          }
          Write-Output 'G5 check_only ready; provider_calls=0; database_writes=0.'

      - name: Preflight 50 identities and sessions
        if: inputs.mode == 'preflight'
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          DOCKER_HOST: ${{ steps.runtime.outputs.docker_host }}
          CONTAINER: ${{ steps.runtime.outputs.container }}
          PRIVATE_DIR: ${{ steps.runtime.outputs.private_dir }}
          PRIVATE_FILE_NAME: ${{ steps.runtime.outputs.private_file_name }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
        run: |
          $ErrorActionPreference = 'Stop'
          $running = & docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'import json; from app.shared.config.settings import get_settings; s=get_settings(); print(json.dumps({"chat_query_limit":s.chat_query_limit,"access_token_expire_minutes":s.access_token_expire_minutes}))' 2>$null
          if ($LASTEXITCODE -ne 0 -or @($running).Count -ne 1) {
            throw 'G5 running rate limit and token lifetime are unavailable.'
          }
          try { $settings = $running | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'G5 running settings format is invalid.' }
          $limit = 0
          $ttl = 0
          if (-not [int]::TryParse([string]$settings.chat_query_limit, [ref]$limit) -or
              -not [int]::TryParse([string]$settings.access_token_expire_minutes, [ref]$ttl) -or
              $limit -lt 1 -or $limit -gt 1000 -or $ttl -lt 1) {
            throw 'G5 running settings values are invalid.'
          }
          $hostFile = Join-Path $env:PRIVATE_DIR $env:PRIVATE_FILE_NAME
          $source = Join-Path $env:SOURCE_PATH 'src/backend'
          $args = @(
            '--host', $env:DOCKER_HOST, 'run', '--rm', '--pull=never', '--read-only',
            '--network', "container:$env:CONTAINER", '--user', '0:0',
            '-e', 'PYTHONPATH=/opt/crm-g5-source:/app',
            '--mount', "type=bind,source=$source,target=/opt/crm-g5-source,readonly",
            '--mount', "type=bind,source=$hostFile,target=/opt/crm-g5-credentials.json,readonly",
            '--entrypoint', 'python', $env:EXPECTED_BACKEND_IMAGE,
            '-B', '-m', 'scripts.preflight_sse_staging_fixture',
            '--credentials-file', '/opt/crm-g5-credentials.json'
          )
          $output = & docker @args 2>$null
          $exitCode = $LASTEXITCODE
          try { $report = $output | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'G5 preflight returned no valid summary.' }
          $allowed = @('transport_error', 'auth_rejected', 'identity_invalid',
            'permission_missing', 'duplicate_identity', 'session_inaccessible',
            'insufficient_clients', 'credentials_invalid', 'internal_error')
          $failures = @($report.failures.PSObject.Properties | ForEach-Object {
            if ($_.Name -cnotin $allowed -or [string]$_.Value -cnotmatch '^[0-9]{1,3}$') {
              throw 'G5 preflight failure category is invalid.'
            }
            "$($_.Name)=$($_.Value)"
          })
          $identities = 0
          if ($report.mode -cne 'preflight' -or $report.required_clients -ne 50 -or
              $report.provider_calls -ne 0 -or
              -not [int]::TryParse([string]$report.distinct_authorized_users, [ref]$identities) -or
              $identities -lt 0 -or $identities -gt 50 -or $report.ready -isnot [bool]) {
            throw 'G5 preflight summary is invalid.'
          }
          Write-Output "G5 preflight identities=$identities/50; auth_ready=$($report.ready); running_query_limit=$limit; rate_limit_sufficient=$($limit -ge 50); access_token_ttl_minutes=$ttl; provider_calls=0; failures=$($failures -join ',')."
          if ($exitCode -ne 0 -or $report.ready -cne $true -or $limit -lt 50) {
            throw 'G5 identity, session, or rate-limit preflight failed; no SSE load was sent.'
          }

      - name: Diagnose one existing G5 token
        if: inputs.mode == 'diagnose_auth'
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          DOCKER_HOST: ${{ steps.runtime.outputs.docker_host }}
          CONTAINER: ${{ steps.runtime.outputs.container }}
          PRIVATE_DIR: ${{ steps.runtime.outputs.private_dir }}
          PRIVATE_FILE_NAME: ${{ steps.runtime.outputs.private_file_name }}
          ENV_FILE: ${{ secrets.CRM_STAGING_ENV_FILE }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeKeySha = (& docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'import hashlib; from app.shared.config.settings import get_settings; print(hashlib.sha256(get_settings().jwt_secret_key.encode()).hexdigest())' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $runtimeKeySha -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Running JWT configuration could not be classified.'
          }
          $runtimeAlgorithm = (& docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'from app.shared.config.settings import get_settings; print(get_settings().jwt_algorithm)' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $runtimeAlgorithm -cnotin @('HS256', 'HS384', 'HS512')) {
            throw 'Running JWT algorithm could not be classified.'
          }
          $hostFile = Join-Path $env:PRIVATE_DIR $env:PRIVATE_FILE_NAME
          $source = Join-Path $env:SOURCE_PATH 'src/backend'
          $args = @(
            '--host', $env:DOCKER_HOST, 'run', '--rm', '--pull=never', '--read-only',
            '--network', "container:$env:CONTAINER", '--user', '0:0',
            '--env-file', $env:ENV_FILE,
            '-e', 'APP_ENV=staging', '-e', 'AUTH_COOKIE_SECURE=true',
            '-e', 'LLM_ENABLED=false', '-e', 'LLM_LIVE_EVAL=false',
            '-e', 'REAL_TIKTOK_READ_ENABLED=false', '-e', 'REAL_TIKTOK_WEBHOOK_ENABLED=false',
            '-e', 'REAL_TIKTOK_MESSAGE_WRITE_ENABLED=false', '-e', 'REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED=false',
            '-e', 'AI_TRANSLATION_ENABLED=false', '-e', 'AI_MARKETING_ENABLED=false',
            '-e', 'AUTO_REPLY_ENABLED=false',
            '-e', "EXPECTED_RUNTIME_JWT_SHA256=$runtimeKeySha",
            '-e', "EXPECTED_RUNTIME_JWT_ALGORITHM=$runtimeAlgorithm",
            '-e', 'PYTHONPATH=/opt/crm-g5-source:/app',
            '--mount', "type=bind,source=$source,target=/opt/crm-g5-source,readonly",
            '--mount', "type=bind,source=$hostFile,target=/opt/crm-g5-credentials.json,readonly",
            '--entrypoint', 'python', $env:EXPECTED_BACKEND_IMAGE,
            '-B', '-m', 'scripts.diagnose_sse_staging_auth',
            '--credentials-file', '/opt/crm-g5-credentials.json'
          )
          $output = & docker @args 2>$null
          $exitCode = $LASTEXITCODE
          try { $report = $output | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'G5 auth diagnostic returned no valid summary.' }
          if ($report.mode -cne 'diagnose_auth' -or
              $report.token_state -cnotin @('valid', 'expired', 'signature_mismatch', 'algorithm_mismatch', 'claims_invalid', 'config_invalid', 'credentials_invalid') -or
              $report.runtime_key_match -isnot [bool] -or
              $report.runtime_algorithm_match -isnot [bool] -or
              $report.auth_http_status -cnotin @('200', '400', '401', '403', '404', '408', '409', '422', '429', '500', '502', '503', '504', 'other', 'transport_error', 'not_sent') -or
              $report.api_error_code -cnotin @('none', 'unknown', 'not_applicable', '40001', '40101', '40102', '40301', '40401', '40901', '42901', '50001', '50003') -or
              $report.requests_sent -cnotin @(0, 1) -or $report.provider_calls -ne 0) {
            throw 'G5 auth diagnostic summary is invalid.'
          }
          Write-Output "G5 auth diagnostic token_state=$($report.token_state); runtime_key_match=$($report.runtime_key_match); runtime_algorithm_match=$($report.runtime_algorithm_match); auth_http_status=$($report.auth_http_status); api_error_code=$($report.api_error_code); requests_sent=$($report.requests_sent); provider_calls=0."
          if ($exitCode -ne 0 -or $report.requests_sent -ne 1) {
            throw 'G5 auth diagnostic could not classify one existing token.'
          }

      - name: Classify fixed G5 auth error logs
        if: inputs.mode == 'diagnose_auth_logs'
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          DOCKER_HOST: ${{ steps.runtime.outputs.docker_host }}
          CONTAINER: ${{ steps.runtime.outputs.container }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(& docker --host $env:DOCKER_HOST logs --since 2026-10-16T06:45:05Z --until 2026-10-16T06:45:20Z $env:CONTAINER 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw 'Fixed G5 auth log window could not be read.'
          }
          $source = Join-Path $env:SOURCE_PATH 'src/backend'
          $args = @(
            '--host', $env:DOCKER_HOST, 'run', '--rm', '-i', '--pull=never', '--read-only',
            '--network', 'none', '--user', '0:0', '-e', 'PYTHONPATH=/opt/crm-g5-source:/app',
            '--mount', "type=bind,source=$source,target=/opt/crm-g5-source,readonly",
            '--entrypoint', 'python', $env:EXPECTED_BACKEND_IMAGE,
            '-B', '-m', 'scripts.classify_staging_auth_logs'
          )
          $output = $lines | & docker @args 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw 'Fixed G5 auth log classification failed.'
          }
          try { $report = $output | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'Fixed G5 auth log report is invalid.' }
          $allowed = @('OperationalError', 'ProgrammingError', 'IntegrityError', 'DatabaseError', 'InterfaceError', 'MissingGreenlet', 'InvalidRequestError', 'StatementError', 'UndefinedTableError', 'UndefinedColumnError', 'ConnectionDoesNotExistError', 'TimeoutError', 'ValidationError', 'ValueError', 'TypeError', 'KeyError', 'AttributeError', 'RuntimeError', 'other')
          if ($report.exception_types -isnot [pscustomobject]) {
            throw 'Fixed G5 auth log category is invalid.'
          }
          $categories = @()
          [long]$total = 0
          foreach ($property in $report.exception_types.PSObject.Properties) {
            $category = [string]$property.Name
            [long]$count = 0
            if ($category -cnotin $allowed -or
                -not [long]::TryParse([string]$property.Value, [ref]$count) -or
                $count -lt 1 -or $count -gt 1000) {
              throw 'Fixed G5 auth log category is invalid.'
            }
            $categories += $category
            $total += $count
          }
          [long]$matched = 0
          if ($report.mode -cne 'diagnose_auth_logs' -or $report.provider_calls -ne 0 -or
              -not [long]::TryParse([string]$report.matched_events, [ref]$matched) -or
              $matched -lt 0 -or $matched -gt 1000 -or $total -ne $matched) {
            throw 'Fixed G5 auth log summary is invalid.'
          }
          $summary = if ($categories.Count -eq 0) { 'none' } else {
            ($categories | Sort-Object | ForEach-Object { "$_=$($report.exception_types.$_)" }) -join ','
          }
          Write-Output "G5 auth log diagnostic matched_events=$total; exception_types=$summary; provider_calls=0."

      - name: Reconcile exact existing G5 fixture
        if: inputs.mode == 'reconcile_check' || inputs.mode == 'reconcile_email'
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_RECONCILE: ${{ inputs.confirm_reconcile }}
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          DOCKER_HOST: ${{ steps.runtime.outputs.docker_host }}
          CONTAINER: ${{ steps.runtime.outputs.container }}
          ENV_FILE: ${{ secrets.CRM_STAGING_ENV_FILE }}
          DATABASE_SHA256: ${{ steps.runtime.outputs.database_sha256 }}
          PRIVATE_DIR: ${{ steps.runtime.outputs.private_dir }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MODE -ceq 'reconcile_email' -and $env:CONFIRM_RECONCILE -cne 'repair-50-existing-g5-emails') {
            throw 'Exact G5 reconciliation confirmation is required.'
          }
          $runtimeKeySha = (& docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'import hashlib; from app.shared.config.settings import get_settings; print(hashlib.sha256(get_settings().jwt_secret_key.encode()).hexdigest())' 2>$null).Trim()
          $runtimeAlgorithm = (& docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'from app.shared.config.settings import get_settings; print(get_settings().jwt_algorithm)' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $runtimeKeySha -cnotmatch '^[0-9a-f]{64}$' -or
              $runtimeAlgorithm -cnotin @('HS256', 'HS384', 'HS512')) {
            throw 'Running JWT configuration could not be verified.'
          }
          $source = Join-Path $env:SOURCE_PATH 'src/backend'
          $oldName = 'g5-38852775454-1.json'
          $newName = 'g5-38852775454-2.json'
          $oldFile = Join-Path $env:PRIVATE_DIR $oldName
          $newFile = Join-Path $env:PRIVATE_DIR $newName
          if (Test-Path -LiteralPath $newFile) {
            throw 'G5 reconciliation output already exists; retain both private manifests for manual review.'
          }
          $mount = "type=bind,source=$env:PRIVATE_DIR,target=/opt/crm-g5-credentials"
          if ($env:MODE -ceq 'reconcile_check') { $mount += ',readonly' }
          $action = if ($env:MODE -ceq 'reconcile_email') { '--reconcile-email' } else { '--reconcile-check' }
          $args = @(
            '--host', $env:DOCKER_HOST, 'run', '--rm', '--pull=never', '--read-only',
            '--network', "container:$env:CONTAINER", '--user', '0:0',
            '--env-file', $env:ENV_FILE,
            '-e', 'APP_ENV=staging', '-e', 'AUTH_COOKIE_SECURE=true',
            '-e', 'LLM_ENABLED=false', '-e', 'LLM_LIVE_EVAL=false',
            '-e', 'REAL_TIKTOK_READ_ENABLED=false', '-e', 'REAL_TIKTOK_WEBHOOK_ENABLED=false',
            '-e', 'REAL_TIKTOK_MESSAGE_WRITE_ENABLED=false', '-e', 'REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED=false',
            '-e', 'AI_TRANSLATION_ENABLED=false', '-e', 'AI_MARKETING_ENABLED=false',
            '-e', 'AUTO_REPLY_ENABLED=false',
            '-e', "EXPECTED_RUNTIME_JWT_SHA256=$runtimeKeySha",
            '-e', "EXPECTED_RUNTIME_JWT_ALGORITHM=$runtimeAlgorithm",
            '-e', 'PYTHONPATH=/opt/crm-g5-source:/app',
            '--mount', "type=bind,source=$source,target=/opt/crm-g5-source,readonly",
            '--mount', $mount,
            '--entrypoint', 'python', $env:EXPECTED_BACKEND_IMAGE,
            '-B', '-m', 'scripts.prepare_sse_staging_fixture', $action,
            '--source-credentials-file', "/opt/crm-g5-credentials/$oldName",
            '--credentials-file', "/opt/crm-g5-credentials/$newName",
            '--expected-database-sha256', $env:DATABASE_SHA256
          )
          $output = & docker @args 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw 'G5 reconciliation failed or commit is unknown; retain all private manifests and stop.'
          }
          try { $report = $output | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'G5 reconciliation summary is invalid; stop.' }
          if ($env:MODE -ceq 'reconcile_check') {
            if ($report.mode -cne 'reconcile_check' -or $report.ready -cne $true -or
                $report.matched_users -ne 50 -or $report.provider_calls -ne 0 -or
                (Test-Path -LiteralPath $newFile)) {
              throw 'G5 read-only reconciliation did not prove a safe exact batch.'
            }
            Write-Output 'G5 reconcile_check ready; matched_users=50; provider_calls=0; database_writes=0.'
          } else {
            if ($report.mode -cne 'reconcile_email' -or $report.updated_users -ne 50 -or
                $report.rotated_tokens -ne 50 -or $report.provider_calls -ne 0 -or
                -not (Test-Path -LiteralPath $oldFile -PathType Leaf) -or
                -not (Test-Path -LiteralPath $newFile -PathType Leaf)) {
              throw 'G5 reconciliation result is uncertain; retain both private manifests.'
            }
            $newItem = Get-Item -LiteralPath $newFile -Force
            $fileMode = (& stat -c '%a' $newFile).Trim()
            if ($newItem.LinkType -or (& stat -c '%u' $newFile).Trim() -cne '1004' -or
                ([Convert]::ToInt32($fileMode, 8) -band 63) -ne 0) {
              throw 'G5 new private manifest permissions are uncertain; retain both files.'
            }
            Write-Output 'G5 exact fixture reconciled; updated_users=50; rotated_tokens=50; provider_calls=0; original_manifest=retained.'
          }

      - name: Prepare exact G5 synthetic content or renew credentials
        if: inputs.mode == 'content_check' || inputs.mode == 'content_prepare' || inputs.mode == 'renew_credentials'
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_CONTENT: ${{ inputs.confirm_content }}
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          DOCKER_HOST: ${{ steps.runtime.outputs.docker_host }}
          CONTAINER: ${{ steps.runtime.outputs.container }}
          ENV_FILE: ${{ secrets.CRM_STAGING_ENV_FILE }}
          DATABASE_SHA256: ${{ steps.runtime.outputs.database_sha256 }}
          PRIVATE_DIR: ${{ steps.runtime.outputs.private_dir }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (($env:MODE -ceq 'content_prepare' -and $env:CONFIRM_CONTENT -cne 'prepare-50-isolated-g5-messages') -or
              ($env:MODE -ceq 'renew_credentials' -and $env:CONFIRM_CONTENT -cne 'renew-50-existing-g5-tokens')) {
            throw 'Exact G5 content confirmation is required.'
          }
          $serviceContract = (& docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'import inspect; from app.knowledge_base.service import create_entry, set_entry_status; print(int(all("commit" in inspect.signature(fn).parameters for fn in (create_entry, set_entry_status))))' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $serviceContract -cne '1') {
            throw 'Running backend lacks the reviewed transactional knowledge contract.'
          }
          $runtimeKeySha = (& docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'import hashlib; from app.shared.config.settings import get_settings; print(hashlib.sha256(get_settings().jwt_secret_key.encode()).hexdigest())' 2>$null).Trim()
          $runtimeAlgorithm = (& docker --host $env:DOCKER_HOST exec $env:CONTAINER python -B -c 'from app.shared.config.settings import get_settings; print(get_settings().jwt_algorithm)' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $runtimeKeySha -cnotmatch '^[0-9a-f]{64}$' -or
              $runtimeAlgorithm -cnotin @('HS256', 'HS384', 'HS512')) {
            throw 'Running G5 signing configuration is unavailable.'
          }
          $source = Join-Path $env:SOURCE_PATH 'src/backend'
          $oldFile = Join-Path $env:PRIVATE_DIR 'g5-38852775454-2.json'
          $newFile = Join-Path $env:PRIVATE_DIR 'g5-38852775454-3.json'
          if (-not (Test-Path -LiteralPath $oldFile -PathType Leaf) -or (Test-Path -LiteralPath $newFile)) {
            throw 'G5 content source or renewal target is not in the expected state.'
          }
          $mount = "type=bind,source=$env:PRIVATE_DIR,target=/opt/crm-g5-credentials"
          if ($env:MODE -cne 'renew_credentials') { $mount += ',readonly' }
          $action = switch ($env:MODE) {
            'content_prepare' { '--prepare-content' }
            'renew_credentials' { '--renew-credentials' }
            default { '--check-only' }
          }
          $args = @(
            '--host', $env:DOCKER_HOST, 'run', '--rm', '--pull=never', '--read-only',
            '--network', "container:$env:CONTAINER", '--user', '0:0',
            '--env-file', $env:ENV_FILE,
            '-e', 'APP_ENV=staging', '-e', 'AUTH_COOKIE_SECURE=true',
            '-e', 'LLM_ENABLED=false', '-e', 'LLM_LIVE_EVAL=false',
            '-e', 'REAL_TIKTOK_READ_ENABLED=false', '-e', 'REAL_TIKTOK_WEBHOOK_ENABLED=false',
            '-e', 'REAL_TIKTOK_MESSAGE_WRITE_ENABLED=false', '-e', 'REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED=false',
            '-e', 'AI_TRANSLATION_ENABLED=false', '-e', 'AI_MARKETING_ENABLED=false',
            '-e', 'AUTO_REPLY_ENABLED=false',
            '-e', "EXPECTED_RUNTIME_JWT_SHA256=$runtimeKeySha",
            '-e', "EXPECTED_RUNTIME_JWT_ALGORITHM=$runtimeAlgorithm",
            '-e', 'PYTHONPATH=/opt/crm-g5-source:/app',
            '--mount', "type=bind,source=$source,target=/opt/crm-g5-source,readonly",
            '--mount', $mount,
            '--entrypoint', 'python', $env:EXPECTED_BACKEND_IMAGE,
            '-B', '-m', 'scripts.prepare_sse_staging_content', $action,
            '--source-credentials-file', '/opt/crm-g5-credentials/g5-38852775454-2.json',
            '--credentials-file', '/opt/crm-g5-credentials/g5-38852775454-3.json',
            '--expected-database-sha256', $env:DATABASE_SHA256
          )
          $output = & docker @args 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw 'G5 content operation failed or outcome is unknown; retain private material and reconcile read-only.'
          }
          try { $report = $output | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'G5 content summary is invalid; stop.' }
          if ($env:MODE -ceq 'content_check') {
            if ($report.mode -cne 'check_only' -or $report.fixture_state -cnotin @('original', 'prepared') -or
                $report.matched_sessions -ne 50 -or $report.provider_calls -ne 0 -or
                $report.database_writes -ne 0 -or (Test-Path -LiteralPath $newFile)) {
              throw 'G5 content read-only check is inconclusive.'
            }
            Write-Output "G5 content check state=$($report.fixture_state); knowledge_ready=$($report.knowledge_ready); matched_sessions=50; provider_calls=0; database_writes=0."
          } elseif ($env:MODE -ceq 'content_prepare') {
            if ($report.mode -cne 'prepare_content' -or $report.updated_sessions -ne 50 -or
                $report.synthetic_faq -ne 1 -or $report.provider_calls -ne 0 -or
                (Test-Path -LiteralPath $newFile)) {
              throw 'G5 content preparation result is inconclusive.'
            }
            Write-Output 'G5 synthetic content prepared; updated_sessions=50; synthetic_faq=1; provider_calls=0; vectorization requires read-only ready check.'
          } else {
            if ($report.mode -cne 'renew_credentials' -or $report.rotated_tokens -ne 50 -or
                $report.provider_calls -ne 0 -or $report.database_writes -ne 0 -or
                -not (Test-Path -LiteralPath $newFile -PathType Leaf)) {
              throw 'G5 credential renewal result is inconclusive; retain private material.'
            }
            $newItem = Get-Item -LiteralPath $newFile -Force
            $fileMode = (& stat -c '%a' $newFile).Trim()
            if ($newItem.LinkType -or (& stat -c '%u' $newFile).Trim() -cne '1004' -or
                ([Convert]::ToInt32($fileMode, 8) -band 63) -ne 0) {
              throw 'G5 renewed credential permissions are uncertain; retain private material.'
            }
            Write-Output 'G5 exact credentials renewed; rotated_tokens=50; provider_calls=0; database_writes=0; previous_manifest=retained.'
          }

      - name: Provision exact fixture
        if: inputs.mode == 'provision'
        shell: pwsh
        env:
          CONFIRM_PROVISION: ${{ inputs.confirm_provision }}
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          DOCKER_HOST: ${{ steps.runtime.outputs.docker_host }}
          CONTAINER: ${{ steps.runtime.outputs.container }}
          ENV_FILE: ${{ secrets.CRM_STAGING_ENV_FILE }}
          DATABASE_SHA256: ${{ steps.runtime.outputs.database_sha256 }}
          PRIVATE_DIR: ${{ steps.runtime.outputs.private_dir }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CONFIRM_PROVISION -cne 'create-50-isolated-staging-users') {
            throw 'Exact G5 provision confirmation is required.'
          }
          & install -d -m 700 $env:PRIVATE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare private G5 credential directory.' }
          $dirItem = Get-Item -LiteralPath $env:PRIVATE_DIR -Force
          $dirMode = (& stat -c '%a' $env:PRIVATE_DIR).Trim()
          if (-not $dirItem.PSIsContainer -or $dirItem.LinkType -or
              (& stat -c '%u' $env:PRIVATE_DIR).Trim() -cne '1004' -or
              ([Convert]::ToInt32($dirMode, 8) -band 63) -ne 0) {
            throw 'Private G5 credential directory failed post-create checks.'
          }
          $fileName = "g5-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $hostFile = Join-Path $env:PRIVATE_DIR $fileName
          if (Test-Path -LiteralPath $hostFile) {
            throw 'G5 credential file already exists; manual reconciliation is required.'
          }
          $source = Join-Path $env:SOURCE_PATH 'src/backend'
          $args = @(
            '--host', $env:DOCKER_HOST, 'run', '--rm', '--pull=never', '--read-only',
            '--network', "container:$env:CONTAINER", '--user', '0:0',
            '--env-file', $env:ENV_FILE,
            '-e', 'APP_ENV=staging', '-e', 'AUTH_COOKIE_SECURE=true',
            '-e', 'LLM_ENABLED=false', '-e', 'LLM_LIVE_EVAL=false',
            '-e', 'REAL_TIKTOK_READ_ENABLED=false', '-e', 'REAL_TIKTOK_WEBHOOK_ENABLED=false',
            '-e', 'REAL_TIKTOK_MESSAGE_WRITE_ENABLED=false', '-e', 'REAL_TIKTOK_HIGH_RISK_WRITE_ENABLED=false',
            '-e', 'AI_TRANSLATION_ENABLED=false', '-e', 'AI_MARKETING_ENABLED=false',
            '-e', 'AUTO_REPLY_ENABLED=false', '-e', 'PYTHONPATH=/opt/crm-g5-source:/app',
            '--mount', "type=bind,source=$source,target=/opt/crm-g5-source,readonly",
            '--mount', "type=bind,source=$env:PRIVATE_DIR,target=/opt/crm-g5-credentials",
            '--entrypoint', 'python', $env:EXPECTED_BACKEND_IMAGE,
            '-B', '-m', 'scripts.prepare_sse_staging_fixture', '--execute',
            '--credentials-file', "/opt/crm-g5-credentials/$fileName",
            '--expected-database-sha256', $env:DATABASE_SHA256
          )
          $output = & docker @args 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw 'G5 provision failed or commit is unknown; retain any private manifest and reconcile before retry.'
          }
          $report = $output | ConvertFrom-Json
          if ($report.mode -cne 'provision' -or $report.created_users -ne 50 -or
              $report.created_sessions -ne 50 -or $report.provider_calls -ne 0 -or
              -not (Test-Path -LiteralPath $hostFile -PathType Leaf)) {
            throw 'G5 provision result is uncertain; retain the private manifest.'
          }
          $fileMode = (& stat -c '%a' $hostFile).Trim()
          if ((& stat -c '%u' $hostFile).Trim() -cne '1004' -or
              ([Convert]::ToInt32($fileMode, 8) -band 63) -ne 0) {
            throw 'G5 credential file permissions are uncertain; retain the private manifest.'
          }
          Write-Output 'G5 isolated fixture created: users=50; sessions=50; provider_calls=0; private_manifest=retained.'
