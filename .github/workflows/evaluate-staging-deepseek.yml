name: Evaluate staging DeepSeek G4

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare, zero-call canary setup check, one frozen canary, or full live evaluation
        required: true
        type: choice
        options:
          - prepare
          - check_only
          - canary
          - live
      expected_source_sha:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      expected_backend_image:
        description: Exact running crm-backend repository@sha256 digest
        required: true
        type: string
      confirm_live:
        description: For canary type send-one-frozen-case-to-deepseek; for live type send-34-synthetic-cases-to-deepseek
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crm-staging-production-gates
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, crm-staging]
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Fetch exact reviewed G4 inputs
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_SOURCE_SHA -cne $env:GITHUB_SHA) {
            throw 'The reviewed G4 source SHA is invalid.'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $commit = Invoke-RestMethod -Uri "https://api.github.com/repos/CP11-gh/CRM/git/commits/$env:GITHUB_SHA" -Headers $headers -TimeoutSec 30
          if ([string]$commit.sha -cne $env:GITHUB_SHA) {
            throw 'The dispatch SHA is not the reviewed GitHub commit.'
          }
          $sourcePath = Join-Path $env:RUNNER_TEMP "crm-g4-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          foreach ($relative in @(
              'release/evidence/ai/real-model-independent-v1.0.0.jsonl',
              'release/evidence/ai/real-model-independent-v1.0.0.manifest.json',
              'src/backend/app/agent/real_model_evaluation.py',
              'src/backend/app/agent/providers/deepseek_provider.py',
              'src/backend/app/shared/config/llm_pricing.py',
              'src/backend/scripts/evaluate_real_model.py',
              'src/backend/scripts/diagnose_deepseek_canary.py'
          )) {
            $uri = "https://api.github.com/repos/CP11-gh/CRM/contents/${relative}?ref=$env:GITHUB_SHA"
            $source = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30
            if ($source.type -cne 'file' -or $source.encoding -cne 'base64' -or
                [string]$source.sha -cnotmatch '^[0-9a-f]{40}$') {
              throw 'A reviewed G4 source file could not be verified.'
            }
            [byte[]]$sourceBytes = [Convert]::FromBase64String([string]$source.content)
            if ($sourceBytes.Length -lt 1 -or $sourceBytes.Length -gt 100000) {
              throw 'A reviewed G4 source file has an unexpected size.'
            }
            $blobPrefix = [Text.Encoding]::ASCII.GetBytes("blob $($sourceBytes.Length)`0")
            [byte[]]$blobInput = $blobPrefix + $sourceBytes
            $blobSha = [Convert]::ToHexString([Security.Cryptography.SHA1]::HashData($blobInput)).ToLowerInvariant()
            if ($blobSha -cne [string]$source.sha) {
              throw 'A reviewed G4 source file failed Git blob verification.'
            }
            $target = Join-Path $sourcePath $relative
            $null = New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force
            [IO.File]::WriteAllBytes($target, $sourceBytes)
          }
          "source_path=$sourcePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output 'Reviewed G4 inputs fetched by exact GitHub commit and blob SHA.'

      - name: Check frozen inputs and staging runtime
        id: preflight
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.expected_backend_image }}
          CONFIRM_LIVE: ${{ inputs.confirm_live }}
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
        run: |
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_SOURCE_SHA -cne $env:GITHUB_SHA -or
              $env:EXPECTED_BACKEND_IMAGE -cnotmatch '^ghcr\.io/cp11-gh/crm-backend@sha256:[0-9a-f]{64}$' -or
              $env:MODE -cnotin @('prepare', 'check_only', 'canary', 'live')) {
            throw 'The G4 source, backend image, or mode is invalid.'
          }
          if (($env:MODE -ceq 'live' -and $env:CONFIRM_LIVE -cne 'send-34-synthetic-cases-to-deepseek') -or
              ($env:MODE -ceq 'canary' -and $env:CONFIRM_LIVE -cne 'send-one-frozen-case-to-deepseek') -or
              ($env:MODE -cin @('prepare', 'check_only') -and $env:CONFIRM_LIVE)) {
            throw 'The G4 live confirmation does not match the requested mode.'
          }
          $sourcePath = $env:SOURCE_PATH
          if ([string]::IsNullOrWhiteSpace($sourcePath) -or -not (Test-Path -LiteralPath $sourcePath -PathType Container)) {
            throw 'The verified G4 source directory is unavailable.'
          }
          $dataset = Join-Path $sourcePath 'release/evidence/ai/real-model-independent-v1.0.0.jsonl'
          $manifest = Join-Path $sourcePath 'release/evidence/ai/real-model-independent-v1.0.0.manifest.json'
          if (-not (Test-Path -LiteralPath $dataset -PathType Leaf) -or
              -not (Test-Path -LiteralPath $manifest -PathType Leaf) -or
              (Get-FileHash -LiteralPath $dataset -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                '7f7c7084ac37e9aef5c9b1a947a9f44250cd89e290f5ae18990ec558e5c6df94') {
            throw 'The frozen independent G4 dataset is missing or changed.'
          }
          $runnerUid = (& id -u).Trim()
          if ($LASTEXITCODE -ne 0 -or $runnerUid -notmatch '^[1-9][0-9]*$') {
            throw 'Unable to resolve Rootless Docker UID.'
          }
          $dockerHost = "unix:///run/user/$runnerUid/docker.sock"
          $containers = @(& docker --host $dockerHost ps --filter 'label=com.docker.compose.project=crm-staging' --filter 'label=com.docker.compose.service=backend' --format '{{.ID}}')
          if ($LASTEXITCODE -ne 0 -or $containers.Count -ne 1) {
            throw 'Expected exactly one running staging backend.'
          }
          $container = $containers[0]
          $actualImage = (& docker --host $dockerHost inspect --format '{{.Config.Image}}' $container).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualImage -cne $env:EXPECTED_BACKEND_IMAGE) {
            throw 'Running backend image does not match the reviewed digest.'
          }
          foreach ($relative in @('app/agent/real_model_evaluation.py', 'app/agent/providers/deepseek_provider.py', 'app/shared/config/llm_pricing.py', 'scripts/evaluate_real_model.py')) {
            $localPath = Join-Path (Join-Path $sourcePath 'src/backend') $relative
            $localHash = (Get-FileHash -LiteralPath $localPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $containerHashOutput = & docker --host $dockerHost exec $container sha256sum "/app/$relative"
            $containerHash = ($containerHashOutput -split '\s+')[0]
            if ($LASTEXITCODE -ne 0 -or $containerHash -cne $localHash) {
              throw 'The running G4 evaluator differs from the reviewed main source.'
            }
          }
          $containerDir = "/tmp/crm-g4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & docker --host $dockerHost exec $container mkdir $containerDir
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create unique G4 container workspace.' }
          & docker --host $dockerHost cp $dataset "${container}:$containerDir/dataset.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage the G4 dataset.' }
          & docker --host $dockerHost cp $manifest "${container}:$containerDir/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage the G4 manifest.' }
          # docker cp creates root-owned files; grant the existing non-root crm process read access only to these frozen inputs.
          & docker --host $dockerHost exec -u 0 $container chmod 0644 "$containerDir/dataset.jsonl" "$containerDir/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to make the frozen G4 inputs readable to the backend user.' }
          # The zero-call diagnostic must receive invalid settings itself to emit a fixed failure stage.
          if ($env:MODE -cne 'check_only') {
          $inspectionCode = @'
          import json
          import sys
          from pathlib import Path
          from app.agent.real_model_evaluation import load_verified_real_model_evaluation_dataset, validate_real_model_evaluation_environment
          from app.shared.config.settings import get_settings

          settings = get_settings()
          data = load_verified_real_model_evaluation_dataset(Path(sys.argv[1]), Path(sys.argv[2]))
          validate_real_model_evaluation_environment(data, settings.app_env)
          live_cases = sum(case.dependency_state != "model_timeout" for case in data.cases)
          safe = (
              settings.app_env == "staging"
              and settings.llm_primary_provider == "deepseek"
              and settings.llm_primary_model == "deepseek-v4-flash"
              and bool(settings.deepseek_api_key and settings.deepseek_api_key.get_secret_value().strip())
              and not settings.llm_live_eval
              and not settings.real_tiktok_message_write_enabled
              and not settings.auto_reply_enabled
              and len(data.cases) == 36
              and live_cases == 34
              and data.manifest.source == "independent_test"
          )
          print(json.dumps({"safe": safe, "samples": len(data.cases), "live_cases": live_cases,
                            "injected_cases": len(data.cases) - live_cases,
                            "dataset_sha256": data.manifest.dataset_sha256}))
          '@
          $preflightOutput = $inspectionCode | & docker --host $dockerHost exec -i $container python - "$containerDir/dataset.jsonl" "$containerDir/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'G4 in-container dataset and runtime validation failed.' }
          $preflight = $preflightOutput | ConvertFrom-Json -AsHashtable
          if ($null -eq $preflight -or -not $preflight.safe -or
              $preflight.dataset_sha256 -cne '7f7c7084ac37e9aef5c9b1a947a9f44250cd89e290f5ae18990ec558e5c6df94') {
            throw 'G4 runtime or frozen dataset guard failed.'
          }
          }
          "container=$container" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "container_dir=$containerDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "docker_host=$dockerHost" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "backend_image=$actualImage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "G4 preflight: 36 frozen synthetic cases, 34 eligible provider samples, 2 injected failures; no external call made."

      - name: Run bounded canary or zero-call setup check
        if: inputs.mode == 'canary' || inputs.mode == 'check_only'
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.source.outputs.source_path }}
          CONTAINER: ${{ steps.preflight.outputs.container }}
          CONTAINER_DIR: ${{ steps.preflight.outputs.container_dir }}
          DOCKER_HOST: ${{ steps.preflight.outputs.docker_host }}
          MODE: ${{ inputs.mode }}
        run: |
          $scriptPath = Join-Path $env:SOURCE_PATH 'src/backend/scripts/diagnose_deepseek_canary.py'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw 'Reviewed canary source is missing.'
          }
          & docker --host $env:DOCKER_HOST cp $scriptPath "${env:CONTAINER}:$env:CONTAINER_DIR/canary.py"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage reviewed canary source.' }
          & docker --host $env:DOCKER_HOST exec -u 0 $env:CONTAINER chmod 0644 "$env:CONTAINER_DIR/canary.py"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read reviewed canary source.' }
          $checkOnlyFlag = @()
          if ($env:MODE -ceq 'check_only') { $checkOnlyFlag = @('--check-only') }
          & docker --host $env:DOCKER_HOST exec `
            -e PYTHONPATH=/app `
            -e LLM_ENABLED=true `
            -e LLM_LIVE_EVAL=true `
            $env:CONTAINER python -B "$env:CONTAINER_DIR/canary.py" `
            --dataset "$env:CONTAINER_DIR/dataset.jsonl" `
            --manifest "$env:CONTAINER_DIR/manifest.json" `
            --output "$env:CONTAINER_DIR/canary.json" @checkOnlyFlag
          if ($LASTEXITCODE -ne 0) { throw 'Single canary failed before safe evidence was produced.' }

      - name: Run one live evaluation with the existing backend code
        id: live
        if: inputs.mode == 'live'
        continue-on-error: true
        shell: pwsh
        env:
          CONTAINER: ${{ steps.preflight.outputs.container }}
          CONTAINER_DIR: ${{ steps.preflight.outputs.container_dir }}
          DOCKER_HOST: ${{ steps.preflight.outputs.docker_host }}
        run: |
          & docker --host $env:DOCKER_HOST exec `
            -e LLM_ENABLED=true `
            -e LLM_LIVE_EVAL=true `
            -e LLM_INPUT_COST_PER_MILLION_USD=0.44 `
            -e LLM_OUTPUT_COST_PER_MILLION_USD=1.32 `
            -e LLM_PRICING_VERSION=deepseek-v4-2026-08-16-peak-cache-miss `
            -e LLM_PRICING_CURRENCY=USD `
            -e LLM_PRICING_BASIS=conservative_peak_cache_miss `
            $env:CONTAINER python -m scripts.evaluate_real_model `
            --dataset "$env:CONTAINER_DIR/dataset.jsonl" `
            --manifest "$env:CONTAINER_DIR/manifest.json" `
            --output "$env:CONTAINER_DIR/report.json"
          if ($LASTEXITCODE -notin @(0, 1)) {
            throw 'G4 live evaluation failed before producing a quality result.'
          }
          "quality_exit_code=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate and retain low-sensitive evidence
        id: evidence
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          CONTAINER: ${{ steps.preflight.outputs.container }}
          CONTAINER_DIR: ${{ steps.preflight.outputs.container_dir }}
          DOCKER_HOST: ${{ steps.preflight.outputs.docker_host }}
          BACKEND_IMAGE: ${{ steps.preflight.outputs.backend_image }}
          QUALITY_EXIT_CODE: ${{ steps.live.outputs.quality_exit_code }}
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP "crm-g4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          if ($env:MODE -ceq 'live') {
            if ($env:QUALITY_EXIT_CODE -notin @('0', '1')) {
              throw 'The G4 provider run did not produce a quality result.'
            }
            & docker --host $env:DOCKER_HOST cp "${env:CONTAINER}:$env:CONTAINER_DIR/report.json" $evidencePath
            if ($LASTEXITCODE -ne 0) { throw 'Unable to retrieve the G4 low-sensitive report.' }
            $report = Get-Content -LiteralPath $evidencePath -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable
            $allowedReportKeys = @('run_id','model','prompt_version','policy_version','dataset_version','dataset_sha256','dataset_manifest_sha256','dataset_source','pricing_version','pricing_currency','pricing_basis','input_cost_per_million_usd','output_cost_per_million_usd','accuracy_gate','live_model_evaluation','first_output_semantics','passed','metrics','samples','evaluation_flow_version')
            $allowedSampleKeys = @('model','prompt_version','policy_version','dataset_version','run_id','sample_id','category','risk_level','expected_decision','decision','input_hash','output_hash','failure_reason','diagnostics','first_output_latency_ms','total_latency_ms','token_usage','passed','provider_failure','provider_error_code','provider_output_failure_kind','provider_output_schema_issues','injected_failure','first_passed','first_failure_reason','first_diagnostics','first_output_hash','repair_attempted','repair_outcome','provider_call_count','first_token_usage','repair_token_usage','repair_latency_ms','regeneration_attempted','regeneration_outcome','regeneration_token_usage','regeneration_latency_ms','second_attempt_disposition','policy_reason_codes')
            $allowedMetricsKeys = @('sample_count','live_model_sample_count','injected_failure_sample_count','passed_sample_count','failed_sample_count','accuracy','dangerous_escape_count','legal_false_block_count','transfer_rate','provider_failure_count','p95_first_output_latency_ms','p99_total_latency_ms','total_input_tokens','total_output_tokens','estimated_cost_usd','cost_status','first_passed_sample_count','first_accuracy','repair_attempt_count','repair_success_count','repair_final_pass_count','regeneration_attempt_count','regeneration_final_pass_count','provider_call_count')
            if ($report.dataset_sha256 -cne '7f7c7084ac37e9aef5c9b1a947a9f44250cd89e290f5ae18990ec558e5c6df94' -or
                $report.dataset_source -cne 'independent_test' -or
                $report.model -cne 'deepseek-v4-flash' -or
                $report.evaluation_flow_version -cne 'policy-repair-dlp-regeneration-v1' -or
                $report.first_output_semantics -cne 'first_schema_validated_output' -or
                -not $report.live_model_evaluation -or
                $report.samples.Count -ne 36 -or
                $report.metrics.live_model_sample_count -ne 34 -or
                $report.metrics.injected_failure_sample_count -ne 2 -or
                $report.metrics.provider_call_count -lt 34 -or
                $report.metrics.provider_call_count -gt 68 -or
                $report.metrics.repair_attempt_count -gt 34 -or
                $report.metrics.regeneration_attempt_count -gt 34 -or
                ($report.metrics.repair_attempt_count + $report.metrics.regeneration_attempt_count) -gt 34 -or
                $report.metrics.repair_success_count -gt $report.metrics.repair_attempt_count -or
                $report.metrics.repair_final_pass_count -gt $report.metrics.repair_success_count -or
                $report.metrics.regeneration_final_pass_count -gt $report.metrics.regeneration_attempt_count -or
                (($report.Keys | Where-Object { $_ -cnotin $allowedReportKeys }).Count -ne 0) -or
                (($report.metrics.Keys | Where-Object { $_ -cnotin $allowedMetricsKeys }).Count -ne 0) -or
                (($report.samples | ForEach-Object { $_.Keys } | Sort-Object -Unique | Where-Object { $_ -cnotin $allowedSampleKeys }).Count -ne 0)) {
              throw 'G4 report provenance or low-sensitive schema is invalid.'
            }
            $allowedDiagnosticKeys = @('claim_mismatch_fields','forbidden_matches','missing_required_group_indexes')
            $allowedClaimFields = @('count','expected_subjects','subject_type','subject_id','action','tense','polarity','condition','evidence_type','evidence_id','confidence')
            $allowedForbiddenKeys = @('term_index','all_occurrences_inside_quotes','all_occurrences_have_prohibition_cue')
            $allowedTokenKeys = @('input_tokens','output_tokens','total_tokens')
            $allowedRepairOutcomes = @('not_needed','succeeded','failed','blocked','budget_exhausted','provider_failed')
            $allowedSecondAttemptDispositions = @('not_attempted','accepted','model_transfer','dlp_rejected','policy_rejected','provider_failed')
            $allowedProviderErrors = @('LLM_TIMEOUT','LLM_RATE_LIMITED','LLM_CONNECTION_ERROR','LLM_AUTHENTICATION_ERROR','LLM_PERMISSION_DENIED','LLM_INVALID_REQUEST','LLM_PROVIDER_ERROR','LLM_OUTPUT_INVALID','LLM_REFUSAL','LLM_CONFIGURATION_ERROR')
            $allowedOutputFailureKinds = @('unfinished','empty','invalid_structure','invalid_json','invalid_schema')
            $allowedOutputSchemaPaths = @('root','unknown','decision','content','language','reason_code','business_claims','send_performed','business_claims[].subject_type','business_claims[].subject_id','business_claims[].action','business_claims[].tense','business_claims[].polarity','business_claims[].condition','business_claims[].evidence_type','business_claims[].evidence_id','business_claims[].confidence')
            $allowedOutputSchemaErrorTypes = @('missing','extra_forbidden','literal_error','string_type','string_too_short','string_too_long','list_type','too_long','less_than_equal','greater_than_equal','float_parsing','uuid_parsing','value_error','model_type','other')
            $allowedPolicyReasons = @('POLICY_EVIDENCE_MISMATCH','POLICY_EVIDENCE_UNCERTAIN','POLICY_UNSUPPORTED_APPROVAL_ASSERTION','POLICY_APPROVAL_CONDITION_MISSING','POLICY_REVIEW_STEP_MISSING','POLICY_REPAIR_NO_DRAFT','DRAFT_DLP_BLOCKED_EMAIL','DRAFT_DLP_BLOCKED_PHONE','DRAFT_DLP_BLOCKED_IDENTIFIER','DRAFT_DLP_BLOCKED_SECRET','DRAFT_DLP_BLOCKED_ADDRESS','DRAFT_DLP_UNCERTAIN_LOCATION','DRAFT_DLP_UNCERTAIN_BUSINESS_LOCATION','DRAFT_DLP_UNCERTAIN_LOCATION_TERMS','DRAFT_DLP_UNCERTAIN_LOCATION_SCRIPT','DRAFT_DLP_UNCERTAIN_LOCATION_SEPARATORS','DRAFT_DLP_UNCERTAIN_LOCATION_NUMBERS','DRAFT_DLP_UNCERTAIN_SUBJECT')
            foreach ($sample in $report.samples) {
              if ($sample.provider_call_count -lt 0 -or $sample.provider_call_count -gt 2 -or
                  $sample.repair_outcome -cnotin $allowedRepairOutcomes -or
                  $sample.regeneration_outcome -cnotin $allowedRepairOutcomes -or
                  $sample.second_attempt_disposition -cnotin $allowedSecondAttemptDispositions -or
                  ($sample.repair_attempted -and $sample.regeneration_attempted) -or
                  ($sample.provider_failure -and $sample.provider_error_code -cnotin $allowedProviderErrors) -or
                  (-not $sample.provider_failure -and ($null -ne $sample.provider_error_code -or $null -ne $sample.provider_output_failure_kind -or @($sample.provider_output_schema_issues).Count -ne 0)) -or
                  ($null -ne $sample.provider_output_failure_kind -and $sample.provider_output_failure_kind -cnotin $allowedOutputFailureKinds) -or
                  @($sample.provider_output_schema_issues).Count -gt 8 -or
                  ($sample.provider_output_failure_kind -ceq 'invalid_schema' -and @($sample.provider_output_schema_issues).Count -eq 0) -or
                  ($sample.provider_output_failure_kind -cne 'invalid_schema' -and @($sample.provider_output_schema_issues).Count -ne 0) -or
                  @($sample.policy_reason_codes).Count -gt 3 -or
                  @($sample.policy_reason_codes | Where-Object { $_ -cnotin $allowedPolicyReasons }).Count -ne 0) {
                throw 'G4 repair metadata is invalid.'
              }
              foreach ($issue in @($sample.provider_output_schema_issues)) {
                if ($issue -isnot [array] -or $issue.Count -ne 2 -or
                    $issue[0] -cnotin $allowedOutputSchemaPaths -or
                    $issue[1] -cnotin $allowedOutputSchemaErrorTypes) {
                  throw 'G4 output schema diagnostic is invalid.'
                }
              }
              foreach ($usage in @($sample.token_usage, $sample.first_token_usage, $sample.repair_token_usage, $sample.regeneration_token_usage)) {
                if ($null -ne $usage -and (($usage.Keys | Where-Object { $_ -cnotin $allowedTokenKeys }).Count -ne 0)) {
                  throw 'G4 token usage schema is invalid.'
                }
              }
              foreach ($diagnostic in @($sample.diagnostics, $sample.first_diagnostics)) {
                if ($null -eq $diagnostic) { continue }
                if (($diagnostic.Keys | Where-Object { $_ -cnotin $allowedDiagnosticKeys }).Count -ne 0 -or
                    @($diagnostic.claim_mismatch_fields).Count -gt 11 -or
                    @($diagnostic.forbidden_matches).Count -gt 20 -or
                    @($diagnostic.missing_required_group_indexes).Count -gt 8 -or
                    @($diagnostic.claim_mismatch_fields | Where-Object { $_ -cnotin $allowedClaimFields }).Count -ne 0) {
                  throw 'G4 diagnostic field is not low-sensitive.'
                }
                foreach ($groupIndex in $diagnostic.missing_required_group_indexes) {
                  if (($groupIndex -isnot [int] -and $groupIndex -isnot [long]) -or
                      $groupIndex -lt 0 -or $groupIndex -gt 7) {
                    throw 'G4 required-content diagnostic is not low-sensitive.'
                  }
                }
                foreach ($match in $diagnostic.forbidden_matches) {
                  if (($match.Keys | Where-Object { $_ -cnotin $allowedForbiddenKeys }).Count -ne 0 -or
                      ($match.term_index -isnot [int] -and $match.term_index -isnot [long]) -or
                      $match.term_index -lt 0 -or $match.term_index -gt 19 -or
                      $match.all_occurrences_inside_quotes -isnot [bool] -or
                      $match.all_occurrences_have_prohibition_cue -isnot [bool]) {
                    throw 'G4 forbidden-term diagnostic is not low-sensitive.'
                  }
                }
              }
            }
          } elseif ($env:MODE -ceq 'check_only') {
            & docker --host $env:DOCKER_HOST cp "${env:CONTAINER}:$env:CONTAINER_DIR/canary.json" $evidencePath
            if ($LASTEXITCODE -ne 0) { throw 'Unable to retrieve the zero-call setup check.' }
            try {
              $check = Get-Content -LiteralPath $evidencePath -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable
            } catch { throw 'Zero-call setup evidence could not be parsed safely.' }
            $allowedCheckKeys = @('schema_version','sample_id','check_result','failure_stage','provider_calls','request_hook_seen','service_mutation','production_release')
            $allowedFailureStages = @('none','settings_validation','dataset_validation','runtime_environment','runtime_model','runtime_timeout_mismatch','runtime_url','runtime_key_missing','runtime_write_guard','proxy_present','client_initialization')
            if ($check.Count -ne $allowedCheckKeys.Count -or
                @($check.Keys | Where-Object { $_ -cnotin $allowedCheckKeys }).Count -ne 0 -or
                $check.schema_version -ne 1 -or
                $check.sample_id -cne 'order-open-001' -or
                $check.check_result -cnotin @('ready','rejected') -or
                $check.failure_stage -cnotin $allowedFailureStages -or
                ($check.check_result -ceq 'ready' -and $check.failure_stage -cne 'none') -or
                ($check.check_result -ceq 'rejected' -and $check.failure_stage -ceq 'none') -or
                $check.provider_calls -ne 0 -or
                $check.request_hook_seen -ne $false -or
                $check.service_mutation -ne $false -or
                $check.production_release -ne $false) {
              throw 'Zero-call setup evidence is outside the fixed low-sensitive contract.'
            }
            $check['evidence_type'] = 'staging_g4_canary_setup_check'
            $check['source_sha'] = $env:GITHUB_SHA
            $check['backend_image'] = $env:BACKEND_IMAGE
            $check | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          } elseif ($env:MODE -ceq 'canary') {
            & docker --host $env:DOCKER_HOST cp "${env:CONTAINER}:$env:CONTAINER_DIR/canary.json" $evidencePath
            if ($LASTEXITCODE -ne 0) { throw 'Unable to retrieve the single canary result.' }
            try {
              $canary = Get-Content -LiteralPath $evidencePath -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable
            } catch { throw 'Single canary evidence could not be parsed safely.' }
            $allowedCanaryKeys = @('schema_version','sample_id','dataset_sha256','model','sdk_timeout_seconds','hard_timeout_seconds','sdk_call_count','request_hook_seen','response_headers_seen','request_to_headers','total_duration','result','error_code','input_tokens','output_tokens','service_mutation','production_release')
            $allowedBuckets = @('not_reached','0-100ms','101-500ms','501-2000ms','2001-7000ms','7001-15000ms','>15000ms')
            $allowedCanaryErrors = @('LLM_TIMEOUT','LLM_RATE_LIMITED','LLM_CONNECTION_ERROR','LLM_AUTHENTICATION_ERROR','LLM_PERMISSION_DENIED','LLM_INVALID_REQUEST','LLM_PROVIDER_ERROR','LLM_OUTPUT_INVALID','LLM_REFUSAL','LLM_CONFIGURATION_ERROR','CANARY_HARD_TIMEOUT','CANARY_INTERNAL_FAILURE')
            if ($canary.Count -ne $allowedCanaryKeys.Count -or
                @($canary.Keys | Where-Object { $_ -cnotin $allowedCanaryKeys }).Count -ne 0 -or
                $canary.schema_version -ne 1 -or
                $canary.sample_id -cne 'order-open-001' -or
                $canary.dataset_sha256 -cne '7f7c7084ac37e9aef5c9b1a947a9f44250cd89e290f5ae18990ec558e5c6df94' -or
                $canary.model -cne 'deepseek-v4-flash' -or
                $canary.sdk_timeout_seconds -ne 15 -or
                $canary.hard_timeout_seconds -ne 20 -or
                $canary.sdk_call_count -ne 1 -or
                $canary.request_hook_seen -isnot [bool] -or
                $canary.response_headers_seen -isnot [bool] -or
                ($canary.response_headers_seen -and -not $canary.request_hook_seen) -or
                $canary.request_to_headers -cnotin $allowedBuckets -or
                $canary.total_duration -cnotin $allowedBuckets -or
                $canary.result -cnotin @('completed','provider_failure','hard_timeout','internal_failure') -or
                ($canary.result -ceq 'completed' -and $null -ne $canary.error_code) -or
                ($canary.result -cne 'completed' -and $canary.error_code -cnotin $allowedCanaryErrors) -or
                $canary.input_tokens -lt 0 -or $canary.input_tokens -gt 1000000 -or
                $canary.output_tokens -lt 0 -or $canary.output_tokens -gt 1000000 -or
                $canary.service_mutation -ne $false -or $canary.production_release -ne $false) {
              throw 'Single canary evidence is outside the fixed low-sensitive contract.'
            }
            $canary['evidence_type'] = 'staging_g4_single_canary'
            $canary['source_sha'] = $env:GITHUB_SHA
            $canary['backend_image'] = $env:BACKEND_IMAGE
            $canary | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          } else {
            @{
              schema_version = 1
              evidence_type = 'staging_g4_preflight'
              source_sha = $env:GITHUB_SHA
              backend_image = $env:BACKEND_IMAGE
              dataset_sha256 = '7f7c7084ac37e9aef5c9b1a947a9f44250cd89e290f5ae18990ec558e5c6df94'
              sample_count = 36
              provider_calls = 0
              injected_cases = 2
              production_release = $false
            } | ConvertTo-Json | Out-File -LiteralPath $evidencePath -Encoding utf8
          }
          "evidence_path=$evidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload low-sensitive G4 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-g4-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Surface quality gate result
        if: inputs.mode == 'live' && steps.live.outputs.quality_exit_code == '1'
        shell: pwsh
        run: throw 'The frozen G4 quality gate did not pass; inspect the low-sensitive artifact.'
