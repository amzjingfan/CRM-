name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen uv toolchain
        run: python -m pip install --disable-pip-version-check uv==0.12.3

      - name: Synchronize frozen dependencies
        run: uv sync --frozen --all-groups

      - name: Verify lock file
        run: uv lock --check

      - name: Run Ruff lint
        run: uv run ruff check . ../tests/backend ../tests/integration/postgres

      - name: Check Ruff formatting
        run: uv run ruff format --check . ../tests/backend ../tests/integration/postgres

      - name: Run mypy
        run: uv run mypy app scripts

      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frozen dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build production frontend
        run: npm run build
