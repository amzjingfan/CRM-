# 复制为项目根目录 `.cloudflared/config.yml` 后填写 cloudflared 创建的 Tunnel UUID。
# 凭证文件由 `cloudflared tunnel create` 生成，并保存在 `.cloudflared/`，该目录已被 Git 忽略。
tunnel: YOUR_TUNNEL_UUID
credentials-file: E:/develop/CRM智能聊天系统/CRM智能聊天系统/.cloudflared/YOUR_TUNNEL_UUID.json

ingress:
  # OAuth、Webhook 和所有后端 API 进入 FastAPI。
  - hostname: crm-dev.hophorsefit.com
    path: /v1/*
    service: http://localhost:8000
  # 管理端页面进入 Next.js，保持 Cookie、回跳和 API 同域。
  - hostname: crm-dev.hophorsefit.com
    service: http://localhost:3000
  - service: http_status:404
